<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>African Strike Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      touch-action: none;
    }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }
    #hud {
      position: absolute;
      top: 15px;
      right: 15px;
      color: #00ffcc;
      font-size: 18px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 6px;
      z-index: 5;
    }
    #instructions {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 15, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }
    #instructions h1 {
      color: #e1b12c;
      font-size: 32px;
      margin-bottom: 10px;
    }
    .play-btn {
      padding: 15px 40px;
      font-size: 20px;
      background: #e1b12c;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      margin-top: 15px;
    }
    /* Mobile Controls */
    #shoot-btn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 75px;
      height: 75px;
      background: rgba(225, 177, 44, 0.7);
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #joystick-zone {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      z-index: 10;
    }
    #joystick-knob {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 50px;
      height: 50px;
      background: rgba(225, 177, 44, 0.8);
      border-radius: 50%;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="crosshair"></div>
    <div id="hud">AMMO: <span id="ammo">30</span> / 240</div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="shoot-btn">FIRE</div>

    <div id="instructions">
      <h1>AFRICAN STRIKE</h1>
      <p style="color:#ccc; text-align:center;">Mobile Mode Enabled<br>Use Left Stick to Move | Drag Right Screen to Aim</p>
      <button class="play-btn" onclick="startGame()">START MISSION</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer;
    let ammo = 30;
    let targets = [];
    let gameActive = false;

    let moveX = 0, moveZ = 0;
    let touchLookId = null;
    let lastTouchX = 0, lastTouchY = 0;

    const ammoDisplay = document.getElementById('ammo');
    const instructions = document.getElementById('instructions');

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd2b48c);
      scene.fog = new THREE.FogExp2(0xd2b48c, 0.015);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.y = 2;
      camera.rotation.order = 'YXZ';

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('game-container').appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
      dirLight.position.set(50, 100, 50);
      scene.add(dirLight);

      // Floor
      const groundGeo = new THREE.PlaneGeometry(200, 200);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0xc2a649 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Desert Buildings
      const boxGeo = new THREE.BoxGeometry(10, 8, 10);
      const boxMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
      [[-12, 4, -15], [12, 4, -20], [-20, 4, -35], [18, 4, -40]].forEach(pos => {
        const b = new THREE.Mesh(boxGeo, boxMat);
        b.position.set(...pos);
        scene.add(b);
      });

      // Red Targets
      const targetGeo = new THREE.CylinderGeometry(1.2, 1.2, 4, 16);
      const targetMat = new THREE.MeshLambertMaterial({ color: 0xcc0000 });
      for (let i = 0; i < 6; i++) {
        const target = new THREE.Mesh(targetGeo, targetMat);
        target.position.set((Math.random() - 0.5) * 40, 2, -10 - Math.random() * 30);
        scene.add(target);
        targets.push(target);
      }

      setupTouchControls();
    }

    function startGame() {
      instructions.style.display = 'none';
      gameActive = true;
    }

    function setupTouchControls() {
      // Joystick Setup
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      let joyTouchId = null;

      zone.addEventListener('touchstart', e => {
        const touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
      });

      window.addEventListener('touchmove', e => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joyTouchId) {
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let dist = Math.hypot(dx, dy);
            let maxDist = 40;

            if (dist > maxDist) {
              dx = (dx / dist) * maxDist;
              dy = (dy / dist) * maxDist;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxDist;
            moveZ = dy / maxDist;
          } else if (touch.identifier === touchLookId) {
            let dx = touch.clientX - lastTouchX;
            let dy = touch.clientY - lastTouchY;
            camera.rotation.y -= dx * 0.005;
            camera.rotation.x -= dy * 0.005;
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
          }
        }
      });

      window.addEventListener('touchend', e => {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joyTouchId) {
            joyTouchId = null;
            knob.style.transform = `translate(0px, 0px)`;
            moveX = 0; moveZ = 0;
          } else if (touch.identifier === touchLookId) {
            touchLookId = null;
          }
        }
      });

      // Right Screen Aim Touch
      window.addEventListener('touchstart', e => {
        for (let touch of e.changedTouches) {
          if (touch.clientX > window.innerWidth / 2 && touchLookId === null) {
            touchLookId = touch.identifier;
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
          }
        }
      });

      // Shoot Button Touch
      document.getElementById('shoot-btn').addEventListener('touchstart', (e) => {
        e.stopPropagation();
        shoot();
      });
    }

    function shoot() {
      if (!gameActive || ammo <= 0) return;
      ammo--;
      ammoDisplay.innerText = ammo;

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(targets);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        scene.remove(hit);
        targets = targets.filter(t => t !== hit);
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (gameActive) {
        // Move camera relative to direction
        camera.translateX(moveX * 0.15);
        camera.translateZ(moveZ * 0.15);
        camera.position.y = 2; // Keep at head height
      }

      renderer.render(scene, camera);
    }

    init();
    animate();
  </script>
</body>
</html>
