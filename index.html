<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050708">
<title>African Strike V5</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050708;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  background:#080b0c;
}

#rotate{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:#050708;
  padding:30px;
}

#rotate .box{
  max-width:400px;
}

#rotate .phone{
  font-size:55px;
  margin-bottom:15px;
}

#rotate h2{
  margin:0 0 10px;
  letter-spacing:2px;
}

#rotate p{
  opacity:.7;
}

@media (orientation:portrait){
  #rotate{display:flex}
}
</style>
</head>

<body>

<div id="rotate">
  <div class="box">
    <div class="phone">📱↻</div>
    <h2>ROTATE DEVICE</h2>
    <p>African Strike is designed for landscape mode.</p>
  </div>
</div>

<canvas id="game"></canvas>

<script>
"use strict";

/* =========================================================
   AFRICAN STRIKE V5
   2.5D CINEMATIC SIDE-SCROLLER
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* =========================================================
   GAME STATE
========================================================= */

let state="menu";
let paused=false;

let score=0;
let level=1;
let mission=1;

let cameraX=0;
let worldLength=7600;

let shake=0;
let flash=0;

let lastTime=performance.now();

/* =========================================================
   INPUT
========================================================= */

const keys={};

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key===" "){
    jump();
  }

  if(e.key.toLowerCase()==="r"){
    reload();
  }

  if(e.key.toLowerCase()==="p"){
    paused=!paused;
  }
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

/* =========================================================
   TOUCH STATE
========================================================= */

const moveStick={
  active:false,
  id:null,
  x:0,
  y:0,
  baseX:100,
  baseY:0,
  dx:0,
  dy:0
};

const aimStick={
  active:false,
  id:null,
  x:0,
  y:0,
  baseX:0,
  baseY:0,
  dx:1,
  dy:0
};

let firing=false;

function pointerPos(t){
  return {
    x:t.clientX,
    y:t.clientY
  };
}

/* =========================================================
   PLAYER
========================================================= */

const player={
  x:350,
  y:0,
  vy:0,
  w:48,
  h:100,

  health:100,
  maxHealth:100,

  speed:4.5,
  grounded:true,

  facing:1,

  weapon:"RIFLE",

  ammo:30,
  mag:30,
  reserve:120,

  fireCooldown:0,
  reloadTimer:0,

  invincible:0,

  anim:0
};

/* =========================================================
   WEAPONS
========================================================= */

const weapons={
  RIFLE:{
    mag:30,
    reserve:120,
    damage:24,
    fireRate:110,
    speed:17,
    color:"#f4d35e"
  },

  SHOTGUN:{
    mag:8,
    reserve:48,
    damage:18,
    fireRate:650,
    speed:14,
    color:"#ffb347"
  },

  LASER:{
    mag:20,
    reserve:80,
    damage:34,
    fireRate:180,
    speed:22,
    color:"#62f4ff"
  },

  ROCKET:{
    mag:4,
    reserve:16,
    damage:90,
    fireRate:850,
    speed:9,
    color:"#ff7043"
  }
};

/* =========================================================
   ARRAYS
========================================================= */

let enemies=[];
let bullets=[];
let enemyBullets=[];
let particles=[];
let pickups=[];
let vehicles=[];
let drones=[];
let explosions=[];
let clouds=[];
let obstacles=[];

/* =========================================================
   MISSIONS
========================================================= */

const missions=[
  {
    name:"THE COASTAL NAVAL BASE",
    subtitle:"SECURE THE PORT",
    sky:["#1b4b67","#e0834d","#efb36d"]
  },
  {
    name:"SOVEREIGN DIAMOND MINE",
    subtitle:"DESTROY THE MINING COMPLEX",
    sky:["#171b20","#72513e","#d27b45"]
  },
  {
    name:"NEO-AFRICAN METROPOLIS",
    subtitle:"ENTER THE CITY",
    sky:["#050817","#101b42","#164d69"]
  },
  {
    name:"SAHARA RADAR OUTPOST",
    subtitle:"DISABLE THE RADAR ARRAY",
    sky:["#4c2515","#ce6f32","#f3b65e"]
  },
  {
    name:"JUNGLE BIO-DOME",
    subtitle:"BREACH THE FACILITY",
    sky:["#071a15","#164c35","#3b8060"]
  },
  {
    name:"RIVER DELTA OIL RIG",
    subtitle:"SURVIVE THE STORM",
    sky:["#080d14","#172b36","#475b63"]
  },
  {
    name:"ANCIENT COMMAND CENTER",
    subtitle:"ELIMINATE THE COMMANDER",
    sky:["#130e0c","#35251b","#805638"]
  },
  {
    name:"ORBITAL LAUNCH FACILITY",
    subtitle:"STOP THE LAUNCH",
    sky:["#0b0715","#38205b","#c55e49"]
  }
];

/* =========================================================
   UTILITY
========================================================= */

function rand(a,b){
  return Math.random()*(b-a)+a;
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

/* =========================================================
   LEVEL GENERATION
========================================================= */

function resetGame(){
  score=0;
  level=1;
  mission=1;

  cameraX=0;
  player.x=350;
  player.y=0;
  player.vy=0;
  player.health=100;
  player.weapon="RIFLE";

  applyWeapon("RIFLE");

  generateLevel();

  state="playing";
}

function generateLevel(){

  enemies=[];
  bullets=[];
  enemyBullets=[];
  particles=[];
  pickups=[];
  vehicles=[];
  drones=[];
  explosions=[];
  obstacles=[];
  clouds=[];

  worldLength=6800+mission*850;

  /* clouds */

  for(let i=0;i<35;i++){
    clouds.push({
      x:rand(0,worldLength),
      y:rand(40,230),
      s:rand(.5,1.5)
    });
  }

  /* obstacles */

  for(let x=650;x<worldLength-500;x+=rand(300,600)){
    obstacles.push({
      x,
      w:rand(45,110),
      h:rand(30,80),
      type:Math.random()<.5?"crate":"barrier"
    });
  }

  /* enemies */

  for(let x=850;x<worldLength-650;x+=rand(300,500)){

    let type=Math.random();

    if(type<.15){
      enemies.push({
        type:"heavy",
        x,
        y:0,
        hp:160,
        maxHp:160,
        w:52,
        h:108,
        cooldown:rand(500,1200),
        speed:rand(.4,.8)
      });
    }
    else{
      enemies.push({
        type:"soldier",
        x,
        y:0,
        hp:70,
        maxHp:70,
        w:45,
        h:96,
        cooldown:rand(500,1400),
        speed:rand(.7,1.2)
      });
    }
  }

  /* drones */

  for(let x=1200;x<worldLength-700;x+=rand(900,1400)){
    drones.push({
      x,
      y:rand(170,280),
      hp:65,
      maxHp:65,
      phase:rand(0,Math.PI*2),
      cooldown:rand(600,1500)
    });
  }

  /* weapon pickups */

  for(let x=1300;x<worldLength-900;x+=1500){
    pickups.push({
      type:"weapon",
      weapon:Math.random()<.5?"SHOTGUN":"LASER",
      x,
      y:30,
      bob:rand(0,6)
    });
  }

  /* rocket */

  pickups.push({
    type:"weapon",
    weapon:"ROCKET",
    x:worldLength*.72,
    y:30,
    bob:0
  });

  /* health */

  for(let x=1800;x<worldLength-600;x+=1800){
    pickups.push({
      type:"health",
      x,
      y:35,
      bob:0
    });
  }

  /* vehicles */

  for(let x=2400;x<worldLength-900;x+=2100){
    vehicles.push({
      x,
      y:0,
      w:170,
      h:70,
      hp:250,
      maxHp:250,
      turretCooldown:rand(700,1400)
    });
  }

  /* final boss */

  enemies.push({
    type:"boss",
    x:worldLength-420,
    y:0,
    hp:600+mission*100,
    maxHp:600+mission*100,
    w:80,
    h:145,
    cooldown:700,
    speed:.2
  });
}

/* =========================================================
   WEAPON
========================================================= */

function applyWeapon(name){

  player.weapon=name;

  const w=weapons[name];

  player.mag=w.mag;
  player.ammo=w.mag;
  player.reserve=w.reserve;

  player.reloadTimer=0;
}

function cycleWeapon(){

  const list=["RIFLE","SHOTGUN","LASER","ROCKET"];

  let i=list.indexOf(player.weapon);

  applyWeapon(list[(i+1)%list.length]);
}

/* =========================================================
   SHOOTING
========================================================= */

function shoot(){

  if(state!=="playing" || paused) return;
  if(player.reloadTimer>0) return;
  if(player.fireCooldown>0) return;

  if(player.ammo<=0){
    reload();
    return;
  }

  const w=weapons[player.weapon];

  player.ammo--;

  const angle=Math.atan2(
    aimStick.dy,
    Math.abs(aimStick.dx)<.05 ? 1 : Math.abs(aimStick.dx)
  );

  player.facing=aimStick.dx<0?-1:1;

  if(player.weapon==="SHOTGUN"){

    for(let i=0;i<6;i++){

      const a=angle+rand(-.17,.17);

      bullets.push({
        x:player.x+player.facing*35,
        y:player.y+68,
        vx:Math.cos(a)*w.speed*player.facing,
        vy:Math.sin(a)*w.speed,
        damage:w.damage,
        life:55,
        color:w.color,
        explosive:false
      });
    }
  }

  else{

    bullets.push({
      x:player.x+player.facing*38,
      y:player.y+68,
      vx:Math.cos(angle)*w.speed*player.facing,
      vy:Math.sin(angle)*w.speed,
      damage:w.damage,
      life:100,
      color:w.color,
      explosive:player.weapon==="ROCKET"
    });
  }

  muzzleFlash(
    player.x+player.facing*42,
    player.y+70
  );

  player.fireCooldown=w.fireRate;
}

/* =========================================================
   RELOAD
========================================================= */

function reload(){

  if(player.reloadTimer>0) return;
  if(player.ammo>=player.mag) return;
  if(player.reserve<=0) return;

  player.reloadTimer=950;
}

/* =========================================================
   JUMP
========================================================= */

function jump(){

  if(state!=="playing") return;

  if(player.grounded){

    player.vy=12;
    player.grounded=false;
  }
}

/* =========================================================
   ENEMY SHOOT
========================================================= */

function enemyShoot(e){

  const dx=player.x-e.x;
  const dy=(player.y+55)-(e.y+55);

  const a=Math.atan2(dy,dx);

  enemyBullets.push({
    x:e.x-35,
    y:e.y+65,
    vx:Math.cos(a)*7,
    vy:Math.sin(a)*7,
    damage:e.type==="heavy"?16:9,
    life:150
  });
}

/* =========================================================
   VEHICLE SHOOT
========================================================= */

function vehicleShoot(v){

  const dx=player.x-v.x;
  const dy=player.y+50;

  const a=Math.atan2(dy,dx);

  enemyBullets.push({
    x:v.x,
    y:65,
    vx:Math.cos(a)*8,
    vy:Math.sin(a)*8,
    damage:20,
    life:150
  });
}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(state!=="playing" || paused) return;

  const d=dt/16.67;

  /* timers */

  player.fireCooldown=Math.max(0,player.fireCooldown-dt);
  player.invincible=Math.max(0,player.invincible-dt);

  if(player.reloadTimer>0){

    player.reloadTimer-=dt;

    if(player.reloadTimer<=0){

      const need=player.mag-player.ammo;
      const take=Math.min(need,player.reserve);

      player.ammo+=take;
      player.reserve-=take;
    }
  }

  /* movement */

  let move=moveStick.dx;

  if(keys["a"]||keys["arrowleft"]) move=-1;
  if(keys["d"]||keys["arrowright"]) move=1;

  if(Math.abs(move)>.05){

    player.x+=move*player.speed*d;
    player.facing=move>0?1:-1;
    player.anim+=.18*d;
  }
  else{
    player.anim+=.05*d;
  }

  /* automatic forward pressure */

  player.x+=1.05*d;

  player.x=clamp(player.x,100,worldLength-250);

  /* gravity */

  player.vy-=.62*d;
  player.y+=player.vy*d;

  if(player.y<=0){

    player.y=0;
    player.vy=0;
    player.grounded=true;
  }

  /* camera */

  const targetCamera=player.x-W*.35;

  cameraX+=(targetCamera-cameraX)*.09;

  cameraX=clamp(cameraX,0,worldLength-W);

  /* shoot */

  if(firing) shoot();

  /* bullets */

  updateBullets(d);

  /* enemies */

  updateEnemies(dt,d);

  /* drones */

  updateDrones(dt,d);

  /* vehicles */

  updateVehicles(dt,d);

  /* particles */

  updateParticles(d);

  /* explosions */

  updateExplosions(d);

  /* pickups */

  updatePickups(d);

  /* level completion */

  if(player.x>=worldLength-180 &&
     enemies.filter(e=>e.hp>0 && e.type==="boss").length===0){

    state="complete";
  }

  if(player.health<=0){

    player.health=0;
    state="gameover";
  }

  shake*=.88;
  flash*=.88;
}

/* =========================================================
   BULLETS
========================================================= */

function updateBullets(d){

  for(let i=bullets.length-1;i>=0;i--){

    const b=bullets[i];

    b.x+=b.vx*d;
    b.y+=b.vy*d;

    b.vy-=0.03*d;

    b.life-=d;

    let remove=b.life<=0;

    for(const e of enemies){

      if(e.hp<=0) continue;

      if(
        Math.abs(b.x-e.x)<e.w*.55 &&
        Math.abs(b.y-(e.y+55))<e.h*.6
      ){

        e.hp-=b.damage;

        impact(
          b.x,
          b.y,
          b.color
        );

        if(b.explosive){

          explosion(
            b.x,
            b.y,
            110,
            b.damage
          );
        }

        if(e.hp<=0){

          killEnemy(e);
        }

        remove=true;
        break;
      }
    }

    if(!remove){

      for(const v of vehicles){

        if(v.hp<=0) continue;

        if(
          Math.abs(b.x-v.x)<v.w*.5 &&
          Math.abs(b.y-35)<45
        ){

          v.hp-=b.damage;

          impact(b.x,b.y,"#ffcf70");

          if(v.hp<=0){
            explosion(v.x,35,150,150);
            score+=500;
          }

          remove=true;
          break;
        }
      }
    }

    if(b.x<cameraX-300 || b.x>cameraX+W+300){
      remove=true;
    }

    if(remove) bullets.splice(i,1);
  }
}

/* =========================================================
   ENEMIES
========================================================= */

function updateEnemies(dt,d){

  for(const e of enemies){

    if(e.hp<=0) continue;

    const dx=player.x-e.x;

    /* enemies try to maintain distance */

    if(e.type!=="boss"){

      if(Math.abs(dx)>500){
        e.x+=Math.sign(dx)*e.speed*d;
      }

      if(Math.abs(dx)<300){
        e.x-=Math.sign(dx)*e.speed*.35*d;
      }
    }

    e.cooldown-=dt;

    if(
      e.cooldown<=0 &&
      Math.abs(dx)<850
    ){

      enemyShoot(e);

      e.cooldown=
        e.type==="boss"
        ? rand(350,650)
        : rand(800,1500);
    }
  }

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    if(e.hp<=0){

      if(Math.random()<.15){

        pickups.push({
          type:"health",
          x:e.x,
          y:35,
          bob:0
        });
      }
    }
  }
}

/* =========================================================
   DRONES
========================================================= */

function updateDrones(dt,d){

  for(const dr of drones){

    if(dr.hp<=0) continue;

    dr.phase+=.04*d;

    dr.y+=Math.sin(dr.phase)*.6*d;

    const dx=player.x-dr.x;

    if(Math.abs(dx)>700){
      dr.x+=Math.sign(dx)*1.1*d;
    }

    dr.cooldown-=dt;

    if(
      dr.cooldown<=0 &&
      Math.abs(dx)<850
    ){

      const a=Math.atan2(
        player.y+55-dr.y,
        player.x-dr.x
      );

      enemyBullets.push({
        x:dr.x,
        y:dr.y,
        vx:Math.cos(a)*7,
        vy:Math.sin(a)*7,
        damage:12,
        life:150
      });

      dr.cooldown=rand(800,1400);
    }
  }
}

/* =========================================================
   VEHICLES
========================================================= */

function updateVehicles(dt,d){

  for(const v of vehicles){

    if(v.hp<=0) continue;

    if(player.x>v.x-700){

      v.turretCooldown-=dt;

      if(v.turretCooldown<=0){

        vehicleShoot(v);

        v.turretCooldown=1100;
      }
    }
  }
}

/* =========================================================
   ENEMY BULLETS
========================================================= */

function updateEnemyBullets(d){

  for(let i=enemyBullets.length-1;i>=0;i--){

    const b=enemyBullets[i];

    b.x+=b.vx*d;
    b.y+=b.vy*d;

    b.life-=d;

    if(
      Math.abs(b.x-player.x)<30 &&
      Math.abs(b.y-(player.y+50))<55
    ){

      if(player.invincible<=0){

        player.health-=b.damage;
        player.invincible=450;
        flash=1;
        shake=10;

        impact(
          player.x,
          player.y+50,
          "#ff5555"
        );
      }

      enemyBullets.splice(i,1);
      continue;
    }

    if(b.life<=0){
      enemyBullets.splice(i,1);
    }
  }
}

/* =========================================================
   PICKUPS
========================================================= */

function updatePickups(d){

  for(let i=pickups.length-1;i>=0;i--){

    const p=pickups[i];

    p.bob+=.06*d;

    const py=p.y+Math.sin(p.bob)*6;

    if(
      Math.abs(player.x-p.x)<55 &&
      Math.abs(player.y-py)<70
    ){

      if(p.type==="health"){

        player.health=
          Math.min(
            player.maxHealth,
            player.health+35
          );
      }

      if(p.type==="weapon"){

        applyWeapon(p.weapon);
      }

      pickups.splice(i,1);
    }
  }
}

/* =========================================================
   PARTICLES
========================================================= */

function particle(x,y,color,size=3){

  particles.push({
    x,
    y,
    vx:rand(-3,3),
    vy:rand(-3,3),
    life:rand(15,35),
    size,
    color
  });
}

function updateParticles(d){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*d;
    p.y+=p.vy*d;

    p.vy-=.05*d;

    p.life-=d;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function impact(x,y,color){

  for(let i=0;i<8;i++){
    particle(x,y,color,rand(2,5));
  }
}

function muzzleFlash(x,y){

  for(let i=0;i<7;i++){
    particle(
      x,
      y,
      "#ffd56a",
      rand(3,7)
    );
  }

  shake=3;
}

/* =========================================================
   EXPLOSIONS
========================================================= */

function explosion(x,y,radius,damage){

  explosions.push({
    x,
    y,
    r:5,
    max:radius,
    life:30
  });

  shake=Math.max(shake,radius*.08);

  for(let i=0;i<35;i++){

    particle(
      x,
      y,
      Math.random()<.5?"#ff7b22":"#ffd166",
      rand(3,9)
    );
  }

  for(const e of enemies){

    if(e.hp<=0) continue;

    const d=Math.hypot(
      e.x-x,
      (e.y+50)-y
    );

    if(d<radius){

      const amount=
        damage*(1-d/radius);

      e.hp-=amount;

      if(e.hp<=0){
        killEnemy(e);
      }
    }
  }
}

function updateExplosions(d){

  for(let i=explosions.length-1;i>=0;i--){

    const ex=explosions[i];

    ex.r+=(ex.max-ex.r)*.2;
    ex.life-=d;

    if(ex.life<=0){
      explosions.splice(i,1);
    }
  }
}

/* =========================================================
   KILL ENEMY
========================================================= */

function killEnemy(e){

  if(e.dead) return;

  e.dead=true;

  score+=
    e.type==="boss"
    ? 3000
    : e.type==="heavy"
    ? 300
    : 150;

  explosion(
    e.x,
    e.y+50,
    e.type==="boss"?130:55,
    0
  );

  e.hp=0;
}

/* =========================================================
   DRAWING
========================================================= */

function draw(){

  ctx.save();

  if(shake>1){

    ctx.translate(
      rand(-shake,shake),
      rand(-shake,shake)
    );
  }

  drawSky();
  drawParallax();
  drawGround();
  drawWorld();

  drawParticles();
  drawExplosions();

  drawPlayer();

  ctx.restore();

  drawHUD();

  if(flash>0){

    ctx.fillStyle=`rgba(255,40,40,${flash*.18})`;
    ctx.fillRect(0,0,W,H);
  }

  if(state==="menu") drawMenu();
  if(state==="complete") drawComplete();
  if(state==="gameover") drawGameOver();

  if(paused && state==="playing"){
    drawPause();
  }
}

/* =========================================================
   SKY
========================================================= */

function drawSky(){

  const m=missions[mission-1];

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,m.sky[0]);
  g.addColorStop(.55,m.sky[1]);
  g.addColorStop(1,m.sky[2]);

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

/* =========================================================
   PARALLAX
========================================================= */

function drawParallax(){

  /* sun */

  ctx.globalAlpha=.65;
  ctx.fillStyle="#ffd38a";

  ctx.beginPath();
  ctx.arc(W*.78, H*.25, 70,0,Math.PI*2);
  ctx.fill();

  ctx.globalAlpha=1;

  /* clouds */

  for(const c of clouds){

    const x=c.x-cameraX*.18;

    if(x<-300||x>W+300) continue;

    ctx.fillStyle="rgba(255,255,255,.08)";

    ctx.beginPath();
    ctx.ellipse(
      x,
      c.y,
      120*c.s,
      28*c.s,
      0,0,Math.PI*2
    );
    ctx.fill();
  }

  /* distant mountains */

  ctx.fillStyle="rgba(25,40,39,.7)";

  ctx.beginPath();
  ctx.moveTo(0,H*.54);

  for(let x=-100;x<W+200;x+=120){

    const world=x+cameraX*.25;

    const h=
      50+
      Math.sin(world*.002)*55+
      Math.sin(world*.006)*25;

    ctx.lineTo(x,H*.54-h);
  }

  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.closePath();
  ctx.fill();

  /* skyline / installations */

  if(mission===3){

    drawCity();
  }

  if(mission===4){

    drawRadarBase();
  }

  if(mission===8){

    drawLaunchFacility();
  }
}

function drawCity(){

  const offset=cameraX*.42;

  for(let i=0;i<18;i++){

    const x=i*180-offset%180;

    const h=rand(100,300);

    ctx.fillStyle="#071018";

    ctx.fillRect(
      x,
      H*.54-h,
      110,
      h
    );

    ctx.fillStyle="rgba(80,220,210,.35)";

    for(let y=H*.54-h+20;y<H*.54;y+=28){

      ctx.fillRect(
        x+15,
        y,
        8,
        4
      );

      ctx.fillRect(
        x+42,
        y,
        8,
        4
      );

      ctx.fillRect(
        x+70,
        y,
        8,
        4
      );
    }
  }
}

function drawRadarBase(){

  const offset=cameraX*.35;

  for(let i=0;i<5;i++){

    const x=700+i*400-offset;

    ctx.strokeStyle="rgba(40,45,48,.8)";
    ctx.lineWidth=7;

    ctx.beginPath();
    ctx.arc(
      x,
      H*.52,
      55,
      Math.PI,
      Math.PI*2
    );
    ctx.stroke();

    ctx.fillStyle="#24292b";
    ctx.fillRect(x-8,H*.52-55,16,55);
  }
}

function drawLaunchFacility(){

  const offset=cameraX*.38;

  for(let i=0;i<5;i++){

    const x=300+i*500-offset;

    ctx.fillStyle="#30353a";

    ctx.fillRect(
      x,
      H*.38,
      70,
      H*.2
    );

    ctx.strokeStyle="#687078";
    ctx.lineWidth=5;

    ctx.strokeRect(
      x-15,
      H*.35,
      100,
      H*.25
    );
  }
}

/* =========================================================
   GROUND
========================================================= */

function drawGround(){

  const groundY=H*.72;

  ctx.fillStyle="#151917";
  ctx.fillRect(0,groundY,W,H-groundY);

  /* dirt */

  ctx.fillStyle="#343029";

  for(let x=-100;x<W+100;x+=80){

    const world=x+cameraX;

    ctx.fillRect(
      x,
      groundY+rand(5,30),
      rand(25,70),
      4
    );
  }

  /* road */

  if(mission===1||mission===3){

    ctx.fillStyle="#292d2d";
    ctx.fillRect(
      0,
      groundY,
      W,
      50
    );

    ctx.strokeStyle="rgba(255,210,80,.5)";
    ctx.lineWidth=3;

    const dash=90;

    for(
      let x=-(cameraX%dash);
      x<W;
      x+=dash
    ){

      ctx.beginPath();
      ctx.moveTo(x,groundY+25);
      ctx.lineTo(x+45,groundY+25);
      ctx.stroke();
    }
  }
}

/* =========================================================
   WORLD
========================================================= */

function drawWorld(){

  const groundY=H*.72;

  /* obstacles */

  for(const o of obstacles){

    const x=o.x-cameraX;

    if(x<-200||x>W+200) continue;

    if(o.type==="crate"){

      drawCrate(
        x,
        groundY-o.h,
        o.w,
        o.h
      );
    }
    else{

      drawBarrier(
        x,
        groundY-o.h,
        o.w,
        o.h
      );
    }
  }

  /* vehicles */

  for(const v of vehicles){

    const x=v.x-cameraX;

    if(x>-300&&x<W+300&&v.hp>0){

      drawVehicle(
        x,
        groundY
      );
    }
  }

  /* pickups */

  for(const p of pickups){

    const x=p.x-cameraX;

    if(x>-100&&x<W+100){

      drawPickup(
        x,
        groundY-p.y-Math.sin(p.bob)*6,
        p
      );
    }
  }

  /* enemies */

  for(const e of enemies){

    if(e.hp<=0) continue;

    const x=e.x-cameraX;

    if(x>-150&&x<W+150){

      drawEnemy(
        x,
        groundY-e.y,
        e
      );
    }
  }

  /* drones */

  for(const d of drones){

    if(d.hp<=0) continue;

    const x=d.x-cameraX;

    if(x>-150&&x<W+150){

      drawDrone(
        x,
        groundY-d.y
      );
    }
  }

  /* bullets */

  for(const b of bullets){

    const x=b.x-cameraX;

    ctx.fillStyle=b.color;
    ctx.shadowBlur=10;
    ctx.shadowColor=b.color;

    ctx.beginPath();
    ctx.arc(
      x,
      groundY-b.y,
      b.explosive?5:3,
      0,Math.PI*2
    );
    ctx.fill();

    ctx.shadowBlur=0;
  }

  for(const b of enemyBullets){

    const x=b.x-cameraX;

    ctx.fillStyle="#ff4d3d";

    ctx.beginPath();
    ctx.arc(
      x,
      groundY-b.y,
      3,
      0,Math.PI*2
    );
    ctx.fill();
  }
}

/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

  const groundY=H*.72;

  const x=player.x-cameraX;
  const y=groundY-player.y;

  ctx.save();

  if(player.invincible>0 &&
     Math.floor(player.invincible/80)%2===0){
    ctx.globalAlpha=.4;
  }

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.45)";

  ctx.beginPath();
  ctx.ellipse(
    x,
    groundY+4,
    32,
    8,
    0,0,Math.PI*2
  );
  ctx.fill();

  /* legs */

  const step=Math.sin(player.anim)*7;

  ctx.strokeStyle="#111515";
  ctx.lineWidth=12;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(x-10,y-5);
  ctx.lineTo(x-14+step,y+38);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x+10,y-5);
  ctx.lineTo(x+14-step,y+38);
  ctx.stroke();

  /* boots */

  ctx.lineWidth=8;

  ctx.beginPath();
  ctx.moveTo(x-14+step,y+38);
  ctx.lineTo(x-27+step,y+40);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x+14-step,y+38);
  ctx.lineTo(x+27-step,y+40);
  ctx.stroke();

  /* torso armor */

  ctx.fillStyle="#202825";
  ctx.strokeStyle="#070909";
  ctx.lineWidth=4;

  roundRect(
    ctx,
    x-23,
    y-63,
    46,
    60,
    8
  );

  ctx.fill();
  ctx.stroke();

  /* plate */

  ctx.fillStyle="#303b35";

  roundRect(
    ctx,
    x-17,
    y-53,
    34,
    28,
    4
  );

  ctx.fill();

  /* head */

  ctx.fillStyle="#b88968";

  ctx.beginPath();
  ctx.arc(
    x,
    y-76,
    15,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* helmet */

  ctx.fillStyle="#151b19";
  ctx.strokeStyle="#050707";
  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.arc(
    x,
    y-82,
    20,
    Math.PI,
    Math.PI*2
  );

  ctx.lineTo(x+17,y-73);
  ctx.lineTo(x-17,y-73);
  ctx.closePath();

  ctx.fill();
  ctx.stroke();

  /* visor */

  ctx.fillStyle="#101718";

  ctx.fillRect(
    x-12,
    y-82,
    24,
    7
  );

  /* rifle */

  ctx.strokeStyle="#090b0b";
  ctx.lineWidth=7;

  ctx.beginPath();
  ctx.moveTo(x+10*player.facing,y-38);
  ctx.lineTo(x+55*player.facing,y-52);
  ctx.stroke();

  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.moveTo(x+34*player.facing,y-48);
  ctx.lineTo(x+64*player.facing,y-50);
  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   ENEMY DRAW
========================================================= */

function drawEnemy(x,y,e){

  const scale=e.type==="boss"?1.35:e.type==="heavy"?1.15:1;

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.5)";
  ctx.beginPath();
  ctx.ellipse(0,5,30,8,0,0,Math.PI*2);
  ctx.fill();

  /* legs */

  ctx.strokeStyle="#101111";
  ctx.lineWidth=11;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-10,-4);
  ctx.lineTo(-15,38);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(10,-4);
  ctx.lineTo(15,38);
  ctx.stroke();

  /* body */

  ctx.fillStyle=
    e.type==="boss"
    ? "#241d1d"
    : e.type==="heavy"
    ? "#191b1b"
    : "#242b29";

  ctx.strokeStyle="#050606";
  ctx.lineWidth=4;

  roundRect(
    ctx,
    -23,
    -63,
    46,
    60,
    8
  );

  ctx.fill();
  ctx.stroke();

  /* head */

  ctx.fillStyle="#5d4a3e";

  ctx.beginPath();
  ctx.arc(
    0,
    -77,
    15,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* helmet */

  ctx.fillStyle="#111414";

  ctx.beginPath();
  ctx.arc(
    0,
    -82,
    20,
    Math.PI,
    Math.PI*2
  );
  ctx.fill();

  /* weapon */

  ctx.strokeStyle="#080909";
  ctx.lineWidth=7;

  ctx.beginPath();
  ctx.moveTo(-8,-39);
  ctx.lineTo(-52,-52);
  ctx.stroke();

  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(-38,-48);
  ctx.lineTo(-68,-50);
  ctx.stroke();

  /* boss marking */

  if(e.type==="boss"){

    ctx.fillStyle="#b73333";

    ctx.fillRect(-12,-55,24,6);
  }

  /* health bar */

  const hp=clamp(e.hp/e.maxHp,0,1);

  ctx.fillStyle="rgba(0,0,0,.6)";
  ctx.fillRect(-32,-118,64,6);

  ctx.fillStyle=
    e.type==="boss"
    ? "#e84a4a"
    : "#7fd65d";

  ctx.fillRect(
    -32,
    -118,
    64*hp,
    6
  );

  ctx.restore();
}

/* =========================================================
   DRONE DRAW
========================================================= */

function drawDrone(x,y){

  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle="#343b3a";
  ctx.strokeStyle="#080a0a";
  ctx.lineWidth=4;

  ctx.beginPath();
  ctx.ellipse(0,0,35,13,0,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle="#777e7c";
  ctx.lineWidth=3;

  for(const side of [-1,1]){

    ctx.beginPath();
    ctx.moveTo(side*20,0);
    ctx.lineTo(side*55,-18);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(side*20,0);
    ctx.lineTo(side*55,18);
    ctx.stroke();
  }

  ctx.fillStyle="#e04b42";

  ctx.beginPath();
  ctx.arc(0,3,5,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================================================
   VEHICLE
========================================================= */

function drawVehicle(x,groundY){

  ctx.save();
  ctx.translate(x,groundY);

  /* body */

  ctx.fillStyle="#29302d";
  ctx.strokeStyle="#090b0a";
  ctx.lineWidth=5;

  roundRect(
    ctx,
    -85,
    -65,
    170,
    65,
    10
  );

  ctx.fill();
  ctx.stroke();

  /* cabin */

  ctx.fillStyle="#17201e";

  ctx.beginPath();
  ctx.moveTo(-45,-65);
  ctx.lineTo(-20,-100);
  ctx.lineTo(40,-100);
  ctx.lineTo(65,-65);
  ctx.closePath();

  ctx.fill();
  ctx.stroke();

  /* windows */

  ctx.fillStyle="#152a30";

  ctx.fillRect(-12,-91,27,22);
  ctx.fillRect(23,-91,25,22);

  /* wheels */

  for(const wx of [-55,55]){

    ctx.fillStyle="#090a0a";

    ctx.beginPath();
    ctx.arc(wx,3,21,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#454846";

    ctx.beginPath();
    ctx.arc(wx,3,9,0,Math.PI*2);
    ctx.fill();
  }

  /* turret */

  ctx.strokeStyle="#090a0a";
  ctx.lineWidth=10;

  ctx.beginPath();
  ctx.moveTo(25,-98);
  ctx.lineTo(75,-125);
  ctx.stroke();

  ctx.restore();
}

/* =========================================================
   PICKUPS
========================================================= */

function drawPickup(x,y,p){

  ctx.save();
  ctx.translate(x,y);

  ctx.shadowBlur=20;
  ctx.shadowColor=
    p.type==="health"
    ? "#49ff80"
    : "#ffd34d";

  ctx.fillStyle=
    p.type==="health"
    ? "#1e9e56"
    : "#aa8127";

  roundRect(
    ctx,
    -22,
    -22,
    44,
    44,
    7
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#e8e8e8";
  ctx.lineWidth=2;

  if(p.type==="health"){

    ctx.fillStyle="#fff";

    ctx.fillRect(-5,-16,10,32);
    ctx.fillRect(-16,-5,32,10);
  }
  else{

    ctx.fillStyle="#fff";
    ctx.font="bold 11px Arial";
    ctx.textAlign="center";
    ctx.fillText(
      p.weapon,
      0,
      4
    );
  }

  ctx.restore();
}

/* =========================================================
   CRATES / BARRIERS
========================================================= */

function drawCrate(x,y,w,h){

  ctx.fillStyle="#6a4f2c";
  ctx.strokeStyle="#1d1710";
  ctx.lineWidth=4;

  ctx.fillRect(x,y,w,h);
  ctx.strokeRect(x,y,w,h);

  ctx.strokeStyle="#b88b50";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+w,y+h);
  ctx.moveTo(x+w,y);
  ctx.lineTo(x,y+h);
  ctx.stroke();
}

function drawBarrier(x,y,w,h){

  ctx.fillStyle="#6b7070";
  ctx.strokeStyle="#161919";
  ctx.lineWidth=4;

  ctx.fillRect(x,y,w,h);
  ctx.strokeRect(x,y,w,h);
}

/* =========================================================
   PARTICLE DRAW
========================================================= */

function drawParticles(){

  for(const p of particles){

    const x=p.x-cameraX;
    const y=H*.72-p.y;

    ctx.globalAlpha=
      clamp(p.life/25,0,1);

    ctx.fillStyle=p.color;

    ctx.fillRect(
      x,
      y,
      p.size,
      p.size
    );
  }

  ctx.globalAlpha=1;
}

/* =========================================================
   EXPLOSION DRAW
========================================================= */

function drawExplosions(){

  for(const e of explosions){

    const x=e.x-cameraX;
    const y=H*.72-e.y;

    const alpha=clamp(e.life/30,0,1);

    ctx.globalAlpha=alpha;

    const g=ctx.createRadialGradient(
      x,y,2,
      x,y,e.r
    );

    g.addColorStop(0,"#fff6b0");
    g.addColorStop(.3,"#ffb52e");
    g.addColorStop(.7,"#ef542b");
    g.addColorStop(1,"rgba(40,20,10,0)");

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.arc(
      x,
      y,
      e.r,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* =========================================================
   HUD
========================================================= */

function drawHUD(){

  if(state==="menu") return;

  /* top bar */

  ctx.fillStyle="rgba(4,7,8,.78)";
  ctx.fillRect(0,0,W,72);

  /* health */

  ctx.fillStyle="rgba(255,255,255,.12)";
  ctx.fillRect(20,18,190,15);

  ctx.fillStyle=
    player.health>35
    ? "#59d66d"
    : "#ef4d4d";

  ctx.fillRect(
    20,
    18,
    190*(player.health/player.maxHealth),
    15
  );

  ctx.fillStyle="#fff";
  ctx.font="bold 12px Arial";
  ctx.fillText(
    "HEALTH",
    20,
    51
  );

  /* mission */

  ctx.textAlign="center";

  ctx.font="bold 15px Arial";
  ctx.fillText(
    `MISSION ${mission}  •  ${missions[mission-1].name}`,
    W/2,
    27
  );

  ctx.font="11px Arial";
  ctx.globalAlpha=.7;
  ctx.fillText(
    missions[mission-1].subtitle,
    W/2,
    47
  );
  ctx.globalAlpha=1;

  /* score */

  ctx.textAlign="right";

  ctx.font="bold 14px Arial";

  ctx.fillText(
    `SCORE ${score}`,
    W-20,
    28
  );

  ctx.fillText(
    `${player.weapon}  ${player.ammo}/${player.reserve}`,
    W-20,
    50
  );

  ctx.textAlign="left";

  /* joystick */

  drawJoystick(
    moveStick,
    100,
    H-100
  );

  drawJoystick(
    aimStick,
    W-100,
    H-100,
    true
  );

  /* buttons */

  drawButton(
    W-190,
    H-205,
    70,
    48,
    "FIRE",
    firing
  );

  drawButton(
    W-285,
    H-150,
    70,
    48,
    "JUMP",
    false
  );

  drawButton(
    W-190,
    H-150,
    70,
    48,
    "RELOAD",
    false
  );

  drawButton(
    W-95,
    H-150,
    70,
    48,
    "WEAPON",
    false
  );

  /* progress */

  const progress=
    clamp(
      (player.x-350)/(worldLength-530),
      0,1
    );

  ctx.fillStyle="rgba(255,255,255,.15)";
  ctx.fillRect(
    W/2-150,
    H-20,
    300,
    5
  );

  ctx.fillStyle="#a7d86b";
  ctx.fillRect(
    W/2-150,
    H-20,
    300*progress,
    5
  );
}

function drawJoystick(j,cx,cy,aim=false){

  if(!j.active){

    j.baseX=cx;
    j.baseY=cy;
  }

  ctx.globalAlpha=.38;

  ctx.strokeStyle="#fff";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.arc(
    j.baseX,
    j.baseY,
    52,
    0,
    Math.PI*2
  );
  ctx.stroke();

  ctx.fillStyle="#fff";

  ctx.beginPath();
  ctx.arc(
    j.baseX+j.dx*28,
    j.baseY+j.dy*28,
    22,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.globalAlpha=1;
}

function drawButton(x,y,w,h,text,active){

  ctx.fillStyle=
    active
    ? "rgba(220,70,45,.85)"
    : "rgba(10,15,16,.7)";

  ctx.strokeStyle="rgba(255,255,255,.35)";
  ctx.lineWidth=1;

  roundRect(
    ctx,
    x,y,w,h,10
  );

  ctx.fill();
  ctx.stroke();

  ctx.fillStyle="#fff";
  ctx.font="bold 10px Arial";
  ctx.textAlign="center";
  ctx.fillText(
    text,
    x+w/2,
    y+h/2+4
  );

  ctx.textAlign="left";
}

/* =========================================================
   MENUS
========================================================= */

function overlay(){

  ctx.fillStyle="rgba(0,0,0,.62)";
  ctx.fillRect(0,0,W,H);
}

function drawMenu(){

  overlay();

  ctx.textAlign="center";

  ctx.fillStyle="#fff";

  ctx.font=
    `900 ${Math.min(62,W*.075)}px Arial`;

  ctx.fillText(
    "AFRICAN STRIKE",
    W/2,
    H*.31
  );

  ctx.font="bold 16px Arial";
  ctx.globalAlpha=.8;

  ctx.fillText(
    "TACTICAL 2.5D COMBAT",
    W/2,
    H*.37
  );

  ctx.globalAlpha=1;

  ctx.fillStyle="#a8dc73";

  roundRect(
    ctx,
    W/2-115,
    H*.48,
    230,
    58,
    12
  );

  ctx.fill();

  ctx.fillStyle="#081008";
  ctx.font="bold 18px Arial";

  ctx.fillText(
    "START MISSION",
    W/2,
    H*.48+37
  );

  ctx.fillStyle="#fff";
  ctx.globalAlpha=.55;
  ctx.font="12px Arial";

  ctx.fillText(
    "MOVE • AIM • FIRE • SURVIVE",
    W/2,
    H*.66
  );

  ctx.globalAlpha=1;
}

function drawComplete(){

  overlay();

  ctx.textAlign="center";

  ctx.fillStyle="#a8dc73";
  ctx.font=`900 ${Math.min(45,W*.06)}px Arial`;

  ctx.fillText(
    "MISSION ACCOMPLISHED",
    W/2,
    H*.35
  );

  ctx.fillStyle="#fff";
  ctx.font="bold 18px Arial";

  ctx.fillText(
    `SCORE ${score}`,
    W/2,
    H*.43
  );

  if(mission<8){

    ctx.fillStyle="#fff";
    ctx.globalAlpha=.8;

    ctx.fillText(
      "TAP TO CONTINUE",
      W/2,
      H*.55
    );

    ctx.globalAlpha=1;
  }
  else{

    ctx.fillText(
      "AFRICAN STRIKE COMPLETE",
      W/2,
      H*.55
    );
  }
}

function drawGameOver(){

  overlay();

  ctx.textAlign="center";

  ctx.fillStyle="#ef5350";

  ctx.font=`900 ${Math.min(55,W*.07)}px Arial`;

  ctx.fillText(
    "MISSION FAILED",
    W/2,
    H*.37
  );

  ctx.fillStyle="#fff";

  ctx.font="bold 18px Arial";

  ctx.fillText(
    `SCORE ${score}`,
    W/2,
    H*.45
  );

  ctx.globalAlpha=.8;

  ctx.fillText(
    "TAP TO RETRY",
    W/2,
    H*.56
  );

  ctx.globalAlpha=1;
}

function drawPause(){

  overlay();

  ctx.textAlign="center";

  ctx.fillStyle="#fff";
  ctx.font="900 40px Arial";

  ctx.fillText(
    "PAUSED",
    W/2,
    H/2
  );

  ctx.font="14px Arial";
  ctx.globalAlpha=.7;

  ctx.fillText(
    "TAP PAUSE TO CONTINUE",
    W/2,
    H/2+40
  );

  ctx.globalAlpha=1;
}

/* =========================================================
   TOUCH CONTROLS
========================================================= */

canvas.addEventListener("touchstart",e=>{

  e.preventDefault();

  for(const t of e.changedTouches){

    const p=pointerPos(t);

    /* menu */

    if(state==="menu"){

      resetGame();
      continue;
    }

    if(state==="complete"){

      if(mission<8){

        mission++;
        level=mission;
        generateLevel();
        player.x=350;
        player.health=100;
        state="playing";
      }

      continue;
    }

    if(state==="gameover"){

      resetGame();
      continue;
    }

    /* pause top */

    if(p.x<80 && p.y<80){

      paused=!paused;
      continue;
    }

    if(paused) continue;

    /* movement joystick */

    if(
      p.x<W*.42 &&
      p.y>H*.55
    ){

      moveStick.active=true;
      moveStick.id=t.identifier;
      moveStick.baseX=100;
      moveStick.baseY=H-100;

      updateStick(
        moveStick,
        p.x,
        p.y
      );

      continue;
    }

    /* aim joystick */

    if(
      p.x>W*.58 &&
      p.y>H*.55
    ){

      aimStick.active=true;
      aimStick.id=t.identifier;
      aimStick.baseX=W-100;
      aimStick.baseY=H-100;

      updateStick(
        aimStick,
        p.x,
        p.y
      );

      continue;
    }

    /* fire */

    if(
      p.x>W-205 &&
      p.x<W-115 &&
      p.y>H-225 &&
      p.y<H-150
    ){

      firing=true;
      continue;
    }

    /* jump */

    if(
      p.x>W-300 &&
      p.x<W-210 &&
      p.y>H-180
    ){

      jump();
      continue;
    }

    /* reload */

    if(
      p.x>W-210 &&
      p.x<W-115 &&
      p.y>H-180
    ){

      reload();
      continue;
    }

    /* weapon */

    if(
      p.x>W-115 &&
      p.y>H-180
    ){

      cycleWeapon();
      continue;
    }
  }

},{passive:false});

canvas.addEventListener("touchmove",e=>{

  e.preventDefault();

  for(const t of e.changedTouches){

    const p=pointerPos(t);

    if(moveStick.active &&
       t.identifier===moveStick.id){

      updateStick(
        moveStick,
        p.x,
        p.y
      );
    }

    if(aimStick.active &&
       t.identifier===aimStick.id){

      updateStick(
        aimStick,
        p.x,
        p.y
      );
    }
  }

},{passive:false});

canvas.addEventListener("touchend",e=>{

  for(const t of e.changedTouches){

    if(t.identifier===moveStick.id){

      moveStick.active=false;
      moveStick.dx=0;
      moveStick.dy=0;
    }

    if(t.identifier===aimStick.id){

      aimStick.active=false;
      aimStick.dx=1;
      aimStick.dy=0;
    }

    /* release fire */

    firing=false;
  }

},{passive:false});

canvas.addEventListener("touchcancel",e=>{

  moveStick.active=false;
  aimStick.active=false;
  firing=false;

  moveStick.dx=0;
  moveStick.dy=0;

  aimStick.dx=1;
  aimStick.dy=0;
});

function updateStick(j,x,y){

  let dx=x-j.baseX;
  let dy=y-j.baseY;

  const max=52;
  const d=Math.hypot(dx,dy);

  if(d>max){

    dx=dx/d*max;
    dy=dy/d*max;
  }

  j.dx=dx/max;
  j.dy=dy/max;
}

/* =========================================================
   MOUSE SUPPORT
========================================================= */

canvas.addEventListener("mousedown",e=>{

  if(state==="menu"){
    resetGame();
    return;
  }

  if(state==="complete"){
    if(mission<8){
      mission++;
      level=mission;
      generateLevel();
      player.x=350;
      state="playing";
    }
    return;
  }

  if(state==="gameover"){
    resetGame();
    return;
  }

  firing=true;
});

canvas.addEventListener("mouseup",()=>{
  firing=false;
});

/* =========================================================
   HELPERS
========================================================= */

function roundRect(ctx,x,y,w,h,r){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.arcTo(
    x+w,y,
    x+w,y+h,
    r
  );

  ctx.arcTo(
    x+w,y+h,
    x,y+h,
    r
  );

  ctx.arcTo(
    x,y+h,
    x,y,
    r
  );

  ctx.arcTo(
    x,y,
    x+w,y,
    r
  );

  ctx.closePath();
}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(now){

  const dt=Math.min(40,now-lastTime);

  lastTime=now;

  update(dt);
  updateEnemyBullets(dt/16.67);

  draw();

  requestAnimationFrame(loop);
}

generateLevel();
requestAnimationFrame(loop);

/* =========================================================
   ORIENTATION
========================================================= */

try{
  if(screen.orientation &&
     screen.orientation.lock){
    screen.orientation.lock("landscape").catch(()=>{});
  }
}catch(e){}

</script>
