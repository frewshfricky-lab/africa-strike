<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>African Strike: Dawn Warfare 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }
    #hud {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: #00ffcc;
      font-size: 24px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid #00ffcc;
      z-index: 5;
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      background: rgba(10, 10, 15, 0.9);
      padding: 30px;
      border-radius: 12px;
      border: 2px solid #e1b12c;
      z-index: 10;
      cursor: pointer;
    }
    #instructions h1 {
      color: #e1b12c;
      font-size: 36px;
      margin-bottom: 10px;
    }
    #instructions p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
    }
  </style>
  <!-- Load Three.js library directly from free CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container">
    <div id="crosshair"></div>
    <div id="hud">AMMO: <span id="ammo">30</span> / 240</div>
    
    <div id="instructions">
      <h1>AFRICAN STRIKE</h1>
      <p>
        Click anywhere on the screen to Lock Aim & Play.<br>
        <b>WASD</b> - Move | <b>Mouse</b> - Aim | <b>Left Click</b> - Shoot
      </p>
      <button style="padding: 10px 20px; font-size: 18px; background: #e1b12c; border: none; font-weight: bold; cursor: pointer;">DEPLOY TO WAR</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer;
    let ammo = 30;
    let targets = [];
    let isLocked = false;

    // Movement control variables
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let prevTime = performance.now();

    const instructions = document.getElementById('instructions');
    const ammoDisplay = document.getElementById('ammo');

    function init() {
      // 1. Setup Scene & Fog (Desert feel)
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd2b48c);
      scene.fog = new THREE.FogExp2(0xd2b48c, 0.015);

      // 2. Camera setup
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.y = 2; // Eye level

      // 3. Renderer setup
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.getElementById('game-container').appendChild(renderer.domElement);

      // 4. Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
      dirLight.position.set(50, 100, 50);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 5. Ground (Desert dust)
      const groundGeo = new THREE.PlaneGeometry(200, 200);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0xc2a649 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // 6. Spawn Tactical Compound Buildings
      createCompound();

      // 7. Spawn Enemy Targets
      spawnTargets();

      // Pointer lock controls
      instructions.addEventListener('click', () => {
        document.body.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          isLocked = true;
          instructions.style.display = 'none';
        } else {
          isLocked = false;
          instructions.style.display = 'block';
        }
      });

      // Keyboard & Mouse inputs
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mousedown', onShoot);

      window.addEventListener('resize', onWindowResize);
    }

    function createCompound() {
      const boxGeo = new THREE.BoxGeometry(10, 8, 10);
      const boxMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });

      const positions = [
        [-15, 4, -20], [15, 4, -25], [-25, 4, -40], [20, 4, -50], [0, 4, -60]
      ];

      positions.forEach(pos => {
        const building = new THREE.Mesh(boxGeo, boxMat);
        building.position.set(pos[0], pos[1], pos[2]);
        building.castShadow = true;
        building.receiveShadow = true;
        scene.add(building);
      });
    }

    function spawnTargets() {
      const targetGeo = new THREE.CylinderGeometry(1, 1, 4, 16);
      const targetMat = new THREE.MeshLambertMaterial({ color: 0xcc0000 });

      for (let i = 0; i < 8; i++) {
        const target = new THREE.Mesh(targetGeo, targetMat);
        target.position.set(
          (Math.random() - 0.5) * 60,
          2,
          -10 - Math.random() * 50
        );
        target.castShadow = true;
        scene.add(target);
        targets.push(target);
      }
    }

    function onMouseMove(event) {
      if (!isLocked) return;
      const movementX = event.movementX || 0;
      const movementY = event.movementY || 0;

      camera.rotation.y -= movementX * 0.002;
      camera.rotation.x -= movementY * 0.002;
      camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
    }

    function onKeyDown(event) {
      switch (event.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
      }
    }

    function onKeyUp(event) {
      switch (event.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
      }
    }

    function onShoot() {
      if (!isLocked || ammo <= 0) return;

      ammo--;
      ammoDisplay.innerText = ammo;

      // Raycasting hit test
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const intersects = raycaster.intersectObjects(targets);

      if (intersects.length > 0) {
        const hitObject = intersects[0].object;
        scene.remove(hitObject);
        targets = targets.filter(t => t !== hitObject);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;

      if (isLocked) {
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

        camera.translateX(-velocity.x * delta);
        camera.translateZ(velocity.z * delta);
        camera.position.y = 2; // Lock ground height
      }

      prevTime = time;
      renderer.render(scene, camera);
    }

    init();
    animate();
  </script>
</body>
</html>
