<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mini Chair Jump</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #1a1a24;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #ffffff;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 750px;
      background: linear-gradient(180deg, #2d1b4e 0%, #1c1033 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .score-board {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      color: #ffd700;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 10, 25, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      pointer-events: auto;
      cursor: pointer;
    }

    .overlay h1 {
      font-size: 36px;
      color: #ff4757;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .overlay p {
      font-size: 18px;
      color: #e0e0e0;
      margin-bottom: 24px;
    }

    .btn {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: #fff;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="ui-layer">
      <div class="score-board" id="scoreDisplay">0</div>
    </div>
    <div class="overlay" id="startMenu">
      <h1>Mini Chair Jump</h1>
      <p>Tap/Click to jump over incoming chairs!</p>
      <div class="btn">Tap to Play</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const startMenu = document.getElementById('startMenu');

    let width, height;
    function resize() {
      const container = document.getElementById('game-container');
      width = container.clientWidth;
      height = container.clientHeight;
      canvas.width = width;
      canvas.height = height;
    }
    resize();
    window.addEventListener('resize', resize);

    // Game variables
    let gameActive = false;
    let score = 0;
    let frameCount = 0;
    let speed = 4;
    let groundY = 0;

    const player = {
      x: 60,
      y: 0,
      radius: 18,
      velocityY: 0,
      gravity: 0.65,
      jumpForce: -12,
      isGrounded: false
    };

    let chairs = [];

    function resetGame() {
      groundY = height - 80;
      player.y = groundY - player.radius;
      player.velocityY = 0;
      player.isGrounded = true;
      chairs = [];
      score = 0;
      speed = 4.5;
      frameCount = 0;
      scoreDisplay.innerText = score;
    }

    function spawnChair() {
      const isTall = Math.random() > 0.5;
      const chairWidth = 32;
      const chairHeight = isTall ? 48 : 34;

      chairs.push({
        x: width + 20,
        y: groundY - chairHeight,
        width: chairWidth,
        height: chairHeight,
        passed: false
      });
    }

    function jump() {
      if (player.isGrounded && gameActive) {
        player.velocityY = player.jumpForce;
        player.isGrounded = false;
      }
    }

    function update() {
      if (!gameActive) return;

      frameCount++;

      // Increase speed gradually over time
      if (frameCount % 400 === 0) {
        speed += 0.3;
      }

      // Physics update
      player.velocityY += player.gravity;
      player.y += player.velocityY;

      // Ground check
      if (player.y >= groundY - player.radius) {
        player.y = groundY - player.radius;
        player.velocityY = 0;
        player.isGrounded = true;
      }

      // Chair spawning timing
      if (frameCount % Math.max(70, Math.floor(130 - speed * 5)) === 0) {
        if (Math.random() > 0.2) spawnChair();
      }

      // Update chairs
      for (let i = chairs.length - 1; i >= 0; i--) {
        let c = chairs[i];
        c.x -= speed;

        // Score tracking
        if (!c.passed && c.x + c.width < player.x) {
          c.passed = true;
          score++;
          scoreDisplay.innerText = score;
        }

        // Collision detection (Circle to Box)
        let closestX = Math.max(c.x, Math.min(player.x, c.x + c.width));
        let closestY = Math.max(c.y, Math.min(player.y, c.y + c.height));
        let distX = player.x - closestX;
        let distY = player.y - closestY;
        let distance = Math.sqrt((distX * distX) + (distY * distY));

        if (distance < player.radius - 2) {
          gameOver();
        }

        // Remove offscreen chairs
        if (c.x + c.width < -50) {
          chairs.splice(i, 1);
        }
      }
    }

    function drawChair(c) {
      ctx.fillStyle = '#ff4757';
      // Seat
      ctx.fillRect(c.x, c.y + c.height * 0.4, c.width, 6);
      // Backrest
      ctx.fillRect(c.x + 2, c.y, 6, c.height * 0.4);
      // Legs
      ctx.fillRect(c.x + 2, c.y + c.height * 0.4, 4, c.height * 0.6);
      ctx.fillRect(c.x + c.width - 6, c.y + c.height * 0.4, 4, c.height * 0.6);
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Draw Floor Line
      ctx.strokeStyle = '#5352ed';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(width, groundY);
      ctx.stroke();

      // Floor Fill
      ctx.fillStyle = '#140c26';
      ctx.fillRect(0, groundY, width, height - groundY);

      // Draw Chairs
      chairs.forEach(drawChair);

      // Draw Player
      ctx.fillStyle = '#2ed573';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Eye detail
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(player.x + 6, player.y - 4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(player.x + 8, player.y - 4, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      gameActive = false;
      startMenu.querySelector('h1').innerText = "Game Over";
      startMenu.querySelector('p').innerText = `Score: ${score}`;
      startMenu.querySelector('.btn').innerText = "Tap to Try Again";
      startMenu.style.display = 'flex';
    }

    function startGame() {
      resetGame();
      gameActive = true;
      startMenu.style.display = 'none';
    }

    // Controls
    startMenu.addEventListener('click', startGame);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (!gameActive && startMenu.style.display !== 'none') {
          startGame();
        } else {
          jump();
        }
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      jump();
    });

    gameLoop();
  </script>
</body>
</html>
