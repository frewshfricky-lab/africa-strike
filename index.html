<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>African Strike V7 — 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050706;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff
}

button{
  font:inherit
}

#app{
  position:fixed;
  inset:0;
  background:#050706
}

canvas{
  display:block
}

.hidden{
  display:none!important
}

/* ================= MENU ================= */

#menu,#armory,#result{
  position:absolute;
  inset:0;
  z-index:20;
  background:
    linear-gradient(
      90deg,
      #020402e8,
      #02040270,
      #020402e8
    );
}

.menuPanel{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(650px,92vw);
  padding:28px;
  text-align:center;
  background:#070b08ed;
  border:1px solid #77622b;
  border-radius:18px;
  box-shadow:0 20px 80px #000;
}

.logo{
  font-size:clamp(42px,8vw,76px);
  font-weight:1000;
  font-style:italic;
  line-height:.82;
  text-shadow:0 5px 15px #000
}

.logo span{
  display:block;
  color:#eab42a
}

.sub{
  margin:18px 0 26px;
  color:#c3c8bd;
  letter-spacing:3px
}

.btn{
  border:1px solid #7d6b34;
  background:linear-gradient(#d9aa31,#8e5d13);
  color:#080906;
  font-weight:1000;
  border-radius:10px;
  padding:15px 20px;
  margin:7px;
  box-shadow:0 4px 0 #4a3009;
  min-width:210px
}

.btn.dark{
  background:#111711;
  color:#fff;
  box-shadow:none;
  border-color:#47503f
}

/* ================= ARMORY ================= */

#armory{
  overflow:auto;
  padding:70px 12px 20px
}

.armGrid{
  width:min(1200px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:250px 1fr 310px;
  gap:12px
}

.panel{
  background:#080d09ee;
  border:1px solid #4c503b;
  border-radius:12px;
  padding:12px
}

.panel h2{
  font-size:16px;
  margin:4px 0 12px;
  border-bottom:1px solid #33392d;
  padding-bottom:10px
}

.choice{
  width:100%;
  text-align:left;
  background:#111711;
  color:#fff;
  border:1px solid #394133;
  border-radius:8px;
  padding:11px;
  margin:4px 0
}

.choice.active{
  border-color:#e4b52c;
  background:#28230f
}

.choice b{
  display:block;
  color:#f1bf38
}

.choice small{
  color:#9da79a
}

.preview{
  height:510px;
  border-radius:10px;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      #435444,
      #1d271c 55%,
      #3c3424
    )
}

#previewCanvas{
  width:100%;
  height:100%
}

.weaponName{
  font-size:21px;
  font-weight:1000;
  color:#f1bd36
}

.stat{
  margin:10px 0;
  font-size:11px;
  color:#aeb6a8
}

.bar{
  height:7px;
  background:#292e28;
  border-radius:5px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:#dcae2c
}

.upgrade{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#b47b18;
  color:#080906;
  font-weight:1000;
  margin-top:10px
}

.top{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:58px;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
  background:#050805d9;
  border-bottom:1px solid #635a31
}

.smallLogo{
  font-weight:1000;
  font-style:italic
}

.smallLogo span{
  color:#eab42a
}

.wallet{
  color:#ffd03a;
  font-weight:1000
}

/* ================= GAME HUD ================= */

#hud{
  position:absolute;
  z-index:10;
  left:10px;
  right:10px;
  top:10px;
  display:flex;
  justify-content:space-between;
  pointer-events:none
}

.hudBox{
  background:#050805c9;
  border:1px solid #666040;
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  font-weight:900
}

.hp{
  width:140px;
  height:8px;
  background:#242821;
  border-radius:5px;
  overflow:hidden;
  margin-top:4px
}

.hp i{
  display:block;
  height:100%;
  background:#4eae43
}

#controls{
  position:absolute;
  inset:0;
  z-index:15;
  pointer-events:none
}

.stick{
  position:absolute;
  width:128px;
  height:128px;
  border:2px solid #ffffff38;
  border-radius:50%;
  background:#ffffff0b;
  pointer-events:auto;
  touch-action:none
}

#move{
  left:22px;
  bottom:22px
}

#aim{
  right:22px;
  bottom:22px
}

.knob{
  position:absolute;
  width:54px;
  height:54px;
  left:35px;
  top:35px;
  border-radius:50%;
  background:#e7b62daa;
  border:2px solid #ffe17d
}

.actions{
  position:absolute;
  right:170px;
  bottom:28px;
  display:flex;
  gap:8px;
  pointer-events:auto
}

.action{
  width:62px;
  height:62px;
  border-radius:50%;
  border:1px solid #ffffff42;
  background:#101610df;
  color:#fff;
  font-weight:1000
}

.action.fire{
  width:78px;
  height:78px;
  background:#a33123e8;
  border-color:#ff967c
}

#pause{
  position:absolute;
  right:12px;
  top:70px;
  z-index:18;
  background:#090d09dd;
  color:#fff;
  border:1px solid #69633f;
  border-radius:7px;
  padding:9px 12px
}

#objective{
  position:absolute;
  right:14px;
  top:108px;
  z-index:10;
  background:#070a08cf;
  border:1px solid #69633f;
  border-radius:7px;
  padding:9px 12px;
  font-weight:1000
}

/* ================= RESULT ================= */

#result{
  display:flex;
  align-items:center;
  justify-content:center
}

.resultPanel{
  width:min(500px,90vw);
  padding:30px;
  text-align:center;
  background:#080d09f2;
  border:1px solid #77622b;
  border-radius:16px
}

.resultTitle{
  font-size:38px;
  font-weight:1000;
  color:#edba30
}

@media(max-width:850px){
  .armGrid{
    grid-template-columns:190px 1fr
  }

  .right{
    grid-column:1/-1
  }
}

@media(max-width:600px){
  .armGrid{
    grid-template-columns:1fr
  }

  .preview{
    height:420px
  }

  .actions{
    right:145px
  }
}
</style>
</head>

<body>

<div id="app">

<!-- ================= MAIN MENU ================= -->

<div id="menu">

  <div class="menuPanel">

    <div class="logo">
      AFRICAN
      <span>STRIKE</span>
    </div>

    <div class="sub">
      DAWN WARFARE • V7 3D
    </div>

    <button class="btn" onclick="showArmory()">
      ARMORY
    </button>

    <button class="btn" onclick="startMission()">
      START MISSION
    </button>

    <button class="btn dark" onclick="resetSave()">
      RESET SAVE
    </button>

  </div>

</div>


<!-- ================= ARMORY ================= -->

<div id="armory" class="hidden">

  <div class="top">

    <div class="smallLogo">
      AFRICAN <span>STRIKE</span>
    </div>

    <div>
      LEVEL <b id="level">1</b>
      &nbsp; | &nbsp;
      MISSIONS <b id="missions">0</b>
      &nbsp; | &nbsp;
      <span class="wallet">
        ◆ <b id="credits">2500</b>
      </span>
    </div>

  </div>


  <div class="armGrid">

    <!-- OPERATOR -->

    <div class="panel">

      <h2>OPERATOR</h2>

      <button
        class="choice active"
        data-char="male"
        onclick="chooseChar('male',this)"
      >
        <b>MALE OPERATOR</b>
        <small>Assault specialist</small>
      </button>

      <button
        class="choice"
        data-char="female"
        onclick="chooseChar('female',this)"
      >
        <b>FEMALE OPERATOR</b>
        <small>Recon specialist</small>
      </button>

      <button
        class="choice"
        data-char="veteran"
        onclick="chooseChar('veteran',this)"
      >
        <b>VETERAN</b>
        <small>Combat veteran</small>
      </button>


      <h2>OUTFIT</h2>

      <button
        class="choice active"
        onclick="chooseOutfit('jungle',this)"
      >
        <b>JUNGLE CAMO</b>
        <small>Balanced</small>
      </button>

      <button
        class="choice"
        onclick="chooseOutfit('desert',this)"
      >
        <b>DESERT CAMO</b>
        <small>Heat specialist</small>
      </button>

      <button
        class="choice"
        onclick="chooseOutfit('blackops',this)"
      >
        <b>BLACK OPS</b>
        <small>Movement +5%</small>
      </button>

      <button
        class="choice"
        onclick="chooseOutfit('heavy',this)"
      >
        <b>HEAVY ARMOR</b>
        <small>Health +25</small>
      </button>


      <h2>BOOTS</h2>

      <button
        class="choice active"
        onclick="chooseBoots('combat',this)"
      >
        <b>COMBAT</b>
        <small>Standard</small>
      </button>

      <button
        class="choice"
        onclick="chooseBoots('assault',this)"
      >
        <b>ASSAULT</b>
        <small>Movement +10%</small>
      </button>

      <button
        class="choice"
        onclick="chooseBoots('armored',this)"
      >
        <b>ARMORED</b>
        <small>Health +10</small>
      </button>

    </div>


    <!-- CHARACTER PREVIEW -->

    <div class="panel">

      <h2>OPERATOR PREVIEW</h2>

      <div class="preview">
        <canvas id="previewCanvas"></canvas>
      </div>

      <h2>LOADOUT</h2>

      <div
        id="loadoutText"
        style="
        color:#b8c0b2;
        line-height:1.7;
        font-size:13px
        "
      ></div>

    </div>


    <!-- WEAPONS -->

    <div class="panel right">

      <h2>WEAPON LOCKER</h2>

      <button
        class="choice active"
        onclick="chooseWeapon('rifle',this)"
      >
        <b>ASSAULT RIFLE</b>
        <small>Balanced automatic</small>
      </button>

      <button
        class="choice"
        onclick="chooseWeapon('smg',this)"
      >
        <b>COMBAT SMG</b>
        <small>Fast fire</small>
      </button>

      <button
        class="choice"
        onclick="chooseWeapon('shotgun',this)"
      >
        <b>TACTICAL SHOTGUN</b>
        <small>Close-range power</small>
      </button>

      <button
        class="choice"
        onclick="chooseWeapon('sniper',this)"
      >
        <b>PRECISION RIFLE</b>
        <small>Extreme damage</small>
      </button>

      <button
        class="choice"
        onclick="chooseWeapon('rocket',this)"
      >
        <b>ROCKET LAUNCHER</b>
        <small>Explosive</small>
      </button>


      <div
        style="margin-top:18px"
        class="weaponName"
        id="weaponName"
      >
        ASSAULT RIFLE
      </div>


      <div class="stat">
        DAMAGE
        <div class="bar">
          <i id="dbar"></i>
        </div>
      </div>

      <div class="stat">
        FIRE RATE
        <div class="bar">
          <i id="fbar"></i>
        </div>
      </div>

      <div class="stat">
        ACCURACY
        <div class="bar">
          <i id="abar"></i>
        </div>
      </div>

      <div class="stat">
        MAGAZINE
        <div class="bar">
          <i id="mbar"></i>
        </div>
      </div>


      <button
        class="upgrade"
        id="upgrade"
        onclick="upgradeWeapon()"
      >
        UPGRADE
      </button>

    </div>

  </div>


  <div style="text-align:center;padding:14px">

    <button
      class="btn dark"
      onclick="showMenu()"
    >
      BACK
    </button>

    <button
      class="btn"
      onclick="startMission()"
    >
      START MISSION
    </button>

  </div>

</div>


<!-- ================= GAME ================= -->

<div
  id="game"
  class="hidden"
  style="position:absolute;inset:0"
>

  <div id="hud">

    <div class="hudBox">

      HEALTH

      <div class="hp">
        <i id="healthBar"></i>
      </div>

    </div>


    <div class="hudBox">

      <span id="weaponHud">
        ASSAULT RIFLE
      </span>

      <br>

      SCORE
      <b id="score">0</b>

    </div>


    <div class="hudBox">

      MISSION
      <b id="missionNo">1</b>

    </div>

  </div>


  <div id="objective">
    OBJ: SECURE COMPOUND
  </div>


  <button
    id="pause"
    onclick="togglePause()"
  >
    II
  </button>


  <div id="controls">

    <div
      class="stick"
      id="move"
    >
      <div class="knob"></div>
    </div>


    <div
      class="stick"
      id="aim"
    >
      <div class="knob"></div>
    </div>


    <div class="actions">

      <button
        class="action"
        onclick="jump()"
      >
        JUMP
      </button>

      <button
        class="action"
        onclick="reload()"
      >
        R
      </button>

      <button
        class="action fire"
        onclick="shoot()"
      >
        FIRE
      </button>

    </div>

  </div>

</div>


<!-- ================= RESULT ================= -->

<div
  id="result"
  class="hidden"
>

  <div class="resultPanel">

    <div
      class="resultTitle"
      id="resultTitle"
    >
      MISSION COMPLETE
    </div>

    <p id="resultInfo"></p>

    <button
      class="btn"
      onclick="showArmory()"
    >
      RETURN TO ARMORY
    </button>

    <button
      class="btn dark"
      onclick="startMission()"
    >
      RETRY
    </button>

  </div>

</div>

</div>


<!-- THREE.JS -->

<script type="importmap">
{
  "imports": {
    "three":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>


<script type="module">

import * as THREE from 'three';


/* =========================================
   SAVE DATA
========================================= */

const $ = id => document.getElementById(id);

const SAVE = "AFRICAN_STRIKE_V7_SAVE";

let data =
JSON.parse(localStorage.getItem(SAVE) || "null")
||
{
  level:1,
  missions:0,
  credits:2500,

  character:"male",
  outfit:"jungle",
  boots:"combat",
  weapon:"rifle",

  weapons:{
    rifle:{
      damage:55,
      fire:62,
      accuracy:70,
      mag:55,
      level:1
    },

    smg:{
      damage:43,
      fire:92,
      accuracy:58,
      mag:82,
      level:1
    },

    shotgun:{
      damage:82,
      fire:35,
      accuracy:45,
      mag:30,
      level:1
    },

    sniper:{
      damage:100,
      fire:18,
      accuracy:97,
      mag:18,
      level:1
    },

    rocket:{
      damage:100,
      fire:12,
      accuracy:72,
      mag:12,
      level:1
    }
  }
};


function save(){

  localStorage.setItem(
    SAVE,
    JSON.stringify(data)
  );

  updateWallet();
}


function updateWallet(){

  $("level").textContent =
    data.level;

  $("missions").textContent =
    data.missions;

  $("credits").textContent =
    data.credits.toLocaleString();
}


window.resetSave = () => {

  if(confirm("Reset all progress?")){

    localStorage.removeItem(SAVE);

    location.reload();

  }

};


/* =========================================
   WEAPONS
========================================= */

const names = {

  rifle:"ASSAULT RIFLE",

  smg:"COMBAT SMG",

  shotgun:"TACTICAL SHOTGUN",

  sniper:"PRECISION RIFLE",

  rocket:"ROCKET LAUNCHER"

};


function weaponUI(){

  const w =
    data.weapons[data.weapon];

  $("weaponName").textContent =
    names[data.weapon];

  $("dbar").style.width =
    w.damage + "%";

  $("fbar").style.width =
    w.fire + "%";

  $("abar").style.width =
    w.accuracy + "%";

  $("mbar").style.width =
    w.mag + "%";

  const cost =
    w.level * 1000;

  $("upgrade").textContent =
    w.level >= 10
    ? "MAX LEVEL"
    : `UPGRADE — ◆ ${cost.toLocaleString()}`;

  $("upgrade").disabled =
    w.level >= 10 ||
    data.credits < cost;

  $("loadoutText").innerHTML =

    `Operator:
    <b>${data.character.toUpperCase()}</b>
    <br>

    Outfit:
    <b>${data.outfit.toUpperCase()}</b>
    <br>

    Boots:
    <b>${data.boots.toUpperCase()}</b>
    <br>

    Weapon:
    <b>${names[data.weapon]}</b>`;

  updateWallet();

}


window.chooseChar =
(v,b) => {

  data.character = v;

  document
    .querySelectorAll("[data-char]")
    .forEach(x =>
      x.classList.remove("active")
    );

  b.classList.add("active");

  save();

  drawPreview();

};


window.chooseOutfit =
(v,b) => {

  data.outfit = v;

  b.parentElement
    .querySelectorAll(".choice")
    .forEach(x => {

      if(!x.dataset.char)
        x.classList.remove("active");

    });

  b.classList.add("active");

  save();

  drawPreview();

};


window.chooseBoots =
(v,b) => {

  data.boots = v;

  b.parentElement
    .querySelectorAll(".choice")
    .forEach(x => {

      if(!x.dataset.char)
        x.classList.remove("active");

    });

  b.classList.add("active");

  save();

};


window.chooseWeapon =
(v,b) => {

  data.weapon = v;

  b.parentElement
    .querySelectorAll(".choice")
    .forEach(x =>
      x.classList.remove("active")
    );

  b.classList.add("active");

  weaponUI();

  save();

};


window.upgradeWeapon = () => {

  const w =
    data.weapons[data.weapon];

  const cost =
    w.level * 1000;

  if(
    w.level >= 10 ||
    data.credits < cost
  )
    return;

  data.credits -= cost;

  w.level++;

  w.damage =
    Math.min(
      100,
      w.damage + 5
    );

  w.fire =
    Math.min(
      100,
      w.fire + 4
    );

  w.accuracy =
    Math.min(
      100,
      w.accuracy + 3
    );

  w.mag =
    Math.min(
      100,
      w.mag + 5
    );

  weaponUI();

  save();

};


/* =========================================
   MENU
========================================= */

window.showArmory = () => {

  stopGame();

  $("menu")
    .classList
    .add("hidden");

  $("result")
    .classList
    .add("hidden");

  $("armory")
    .classList
    .remove("hidden");

  weaponUI();

  drawPreview();

};


window.showMenu = () => {

  stopGame();

  $("armory")
    .classList
    .add("hidden");

  $("result")
    .classList
    .add("hidden");

  $("menu")
    .classList
    .remove("hidden");

};


/* =========================================
   THREE.JS GAME VARIABLES
========================================= */

let scene;

let camera;

let renderer;

let clock;

let player;

let playerGroup;

let weaponMesh;

let enemies = [];

let bullets = [];

let enemyBullets = [];

let effects = [];

let terrain = [];

let decor = [];

let buildings = [];

let vehicles = [];

let running = false;

let paused = false;

let score = 0;

let kills = 0;

let worldDistance = 0;

let nextEnemy = 0;

let missionDistance = 1200;

let moveX = 0;

let moveY = 0;

let aimX = 1;

let aimY = 0;

let fireTimer = 0;

let playerHP = 100;


/* =========================================
   MATERIAL HELPERS
========================================= */

function mat(
  color,
  rough=.85,
  metal=0
){

  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    metalness:metal
  });

}


function box(
  w,
  h,
  d,
  color
){

  const m =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      mat(color)
    );

  m.castShadow = true;

  m.receiveShadow = true;

  return m;

}


function cyl(
  r,
  h,
  color
){

  const m =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        r,r,h,10
      ),
      mat(color)
    );

  m.castShadow = true;

  m.receiveShadow = true;

  return m;

}


/* =========================================
   INITIALIZE 3D WORLD
========================================= */

function init3D(){

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(
      0x93a17d
    );

  scene.fog =
    new THREE.Fog(
      0x93a17d,
      45,
      250
    );


  camera =
    new THREE.PerspectiveCamera(
      62,
      innerWidth / innerHeight,
      .1,
      500
    );

  camera.position.set(
    0,
    6,
    11
  );


  renderer =
    new THREE.WebGLRenderer({
      antialias:true,
      powerPreference:"high-performance"
    });


  renderer.setPixelRatio(
    Math.min(
      devicePixelRatio,
      1.7
    )
  );


  renderer.setSize(
    innerWidth,
    innerHeight
  );


  renderer.shadowMap.enabled =
    true;

  renderer.shadowMap.type =

function resize3D(){

    innerWidth /
    innerHeight;

  renderer.setSize(
    innerWidth,
    innerHeight
  );

}

/* =========================================
   SHOOTING
========================================= */

function fireBullet(){

  const w =
    data.weapons[data.weapon];


  const angle =
    Math.atan2(
      aimY,
      aimX
    );


  const dir =
    new THREE.Vector3(
      Math.cos(angle),
      0,
      Math.sin(angle)
    ).normalize();


  const b = {

    x:player.x+1.7,

    z:player.z-.8,

    y:4,

    dir,

    damage:w.damage*.65,

    life:2,

    rocket:
      data.weapon === "rocket"

  };


  bullets.push(b);

  muzzle(
    b.x,
    b.z
  );

}


window.shoot = () => {

  if(!running || paused)
    return;

  if(fireTimer > 0)
    return;


  const w =
    data.weapons[data.weapon];


  fireTimer =
    Math.max(
      .07,
      .55-w.fire/190
    );


  if(
    data.weapon === "shotgun"
  ){

    for(
      let i=-2;
      i<=2;
      i++
    ){

      const a =
        Math.atan2(
          aimY,
          aimX
        ) + i*.09;

      aimX =
        Math.cos(a);

      aimY =
        Math.sin(a);

      fireBullet();

    }

  }else{

    fireBullet();

  }

};


window.reload = () => {

  fireTimer = 0;

};


window.jump = () => {

  if(
    player.y <= .01
  ){

    player.vy = .2;

  }

};


/* =========================================
   GAME UPDATE
========================================= */

function update(dt){

  if(paused)
    return;


  const speed =
    (
      data.outfit === "blackops"
      ? 5.8
      : data.boots === "assault"
      ? 5.5
      : 5
    ) * dt;


  player.x +=
    speed *
    (
      1+
      Math.max(
        0,
        moveX
      )*.55
    );


  player.z +=
    moveY*speed;


  player.z =
    THREE.MathUtils.clamp(
      player.z,
      -20,
      20
    );


  worldDistance =
    player.x;


  /* JUMP */

  if(
    player.vy !== undefined
  ){

    player.y +=
      player.vy || 0;

    player.vy =
      (player.vy || 0)
      -dt*.9;


    if(player.y < 0){

      player.y = 0;

      player.vy = 0;

    }

  }


  playerGroup.position.set(
    player.x,
    player.y,
    player.z
  );


  playerGroup.rotation.y =
    -Math.atan2(
      aimX,
      aimY
    ) +
    Math.PI/2;


  if(fireTimer > 0)
    fireTimer -= dt;


  /* SPAWN ENEMIES */

  nextEnemy -= dt;


  if(
    nextEnemy <= 0 &&
    player.x <
    missionDistance-30
  ){

    spawnEnemy();

    nextEnemy =
      .9 +
      Math.random()*1.3;

  }


  /* ENEMIES */

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const e =
      enemies[i];


    const dx =
      player.x-e.x;

    const dz =
      player.z-e.z;


    if(
      Math.abs(dx)<14
    ){

      e.x +=
        Math.sign(dx)*
        e.speed*
        dt;

    }else{

      e.x +=
        Math.sign(dx)*
        e.speed*
        dt*.15;

    }


    e.z +=
      Math.sign(dz)*
      e.speed*
      dt*.15;


    e.group.position.set(
      e.x,
      0,
      e.z
    );


    e.group.lookAt(
      player.x,
      2.8,
      player.z
    );


    e.cool -= dt;


    if(
      e.cool <= 0 &&
      Math.abs(dx)<26
    ){

      enemyBullets.push({

        x:e.x,

        z:e.z-.7,

        y:4,

        dir:
          new THREE.Vector3(
            dx,
            0,
            dz
          ).normalize(),

        life:2,

        damage:
          e.type === "heavy"
          ? 14
          : 8

      });


      e.cool =
        1.2+
        Math.random()*1.8;

    }


    if(e.hp <= 0){

      explosion(
        e.x,
        e.z
      );


      scene.remove(
        e.group
      );


      enemies.splice(
        i,
        1
      );


      score +=
        e.type === "heavy"
        ? 300
        : 100;


      kills++;

    }

  }


  /* PLAYER BULLETS */

  for(
    let i=bullets.length-1;
    i>=0;
    i--
  ){

    const b =
      bullets[i];


    b.x +=
      b.dir.x*35*dt;

    b.z +=
      b.dir.z*35*dt;

    b.life -= dt;


    let hit = false;


    for(
      const e of enemies
    ){

      if(
        Math.hypot(
          b.x-e.x,
          b.z-e.z
        ) < 2
      ){

        e.hp -=
          b.damage;


        if(b.rocket)
          explosion(
            e.x,
            e.z
          );


        hit = true;

        break;

      }

    }


    if(
      hit ||
      b.life <= 0
    ){

      bullets.splice(
        i,
        1
      );

      continue;

    }

  }


  /* ENEMY BULLETS */

  for(
    let i=enemyBullets.length-1;
    i>=0;
    i--
  ){

    const b =
      enemyBullets[i];


    b.x +=
      b.dir.x*20*dt;

    b.z +=
      b.dir.z*20*dt;

    b.life -= dt;


    if(
      Math.hypot(
        b.x-player.x,
        b.z-player.z
      ) < 1.4
    ){

      playerHP -=
        b.damage;


      enemyBullets.splice(
        i,
        1
      );


      if(
        playerHP <= 0
      ){

        fail();

        return;

      }

    }else if(
      b.life <= 0
    ){

      enemyBullets.splice(
        i,
        1
      );

    }

  }


  /* EFFECTS */

  for(
    let i=effects.length-1;
    i>=0;
    i--
  ){

    const e =
      effects[i];

    e.life -= dt;


    if(e.v)
      e.obj.position.addScaledVector(
        e.v,
        dt
      );


    if(
      e.life <= 0
    ){

      scene.remove(
        e.obj
      );

      effects.splice(
        i,
        1
      );

    }

  }


  /* CAMERA */

  camera.position.lerp(

    new THREE.Vector3(
      player.x-9,
      7.5,
      player.z+11
    ),

    .08

  );


  camera.lookAt(
    player.x+8,
    3,
    player.z
  );


  /* HUD */

  $("healthBar")
    .style.width =
      Math.max(
        0,
        playerHP /
        (data.outfit === "heavy"
          ? 125
          : 100
        ) *
        100
      ) + "%";


  $("score").textContent =
    score;


  $("weaponHud").textContent =
    names[data.weapon];


  /* COMPLETE */

  if(
    player.x >=
    missionDistance
  ){

    complete();

  }

}


/* =========================================
   RENDER LOOP
========================================= */

function render(){

  renderer.render(
    scene,
    camera
  );

}


function loop(){

  if(!running)
    return;


  const dt =
    Math.min(
      clock.getDelta(),
      .033
    );


  update(dt);

  render();

  requestAnimationFrame(
    loop
  );

}


/* =========================================
   GAME START
========================================= */

function clearActors(){

  for(
    const e of enemies
  )
    scene.remove(
      e.group
    );


  enemies = [];

  bullets = [];

  enemyBullets = [];


  for(
    const e of effects
  )
    scene.remove(
      e.obj
    );


  effects = [];

}


function startGameWorld(){

  if(!scene)
    init3D();


  clearActors();


  player.x = 0;

  player.z = 0;

  player.y = 0;

  player.vy = 0;


  playerHP =
    data.outfit === "heavy"
    ? 125
    : data.boots === "armored"
    ? 110
    : 100;


  score = 0;

  kills = 0;

  nextEnemy = .2;


  rebuildPlayer();


  running = true;

  paused = false;

  clock.start();


  $("menu")
    .classList
    .add("hidden");


  $("armory")
    .classList
    .add("hidden");


  $("result")
    .classList
    .add("hidden");


  $("game")
    .classList
    .remove("hidden");


  $("missionNo").textContent =
    data.missions+1;


  requestAnimationFrame(
    loop
  );

}


window.startMission =
  () =>
    startGameWorld();


function stopGame(){

  running = false;

}


window.togglePause =
  () =>
    paused = !paused;


/* =========================================
   MISSION COMPLETE
========================================= */

function complete(){

  running = false;


  const reward =
    1000 +
    kills*100;


  data.credits +=
    reward;


  data.missions++;


  if(
    data.missions % 3 === 0
  )
    data.level++;


  save();


  $("resultTitle")
    .textContent =
      "MISSION COMPLETE";


  $("resultInfo")
    .innerHTML =

    `Compound secured.
    <br><br>
    Enemies eliminated:
    <b>${kills}</b>
    <br>
    Score:
    <b>${score}</b>
    <br>
    Reward:
    <b>◆ ${reward.toLocaleString()}</b>`;


  $("game")
    .classList
    .add("hidden");


  $("result")
    .classList
    .remove("hidden");

}


/* =========================================
   MISSION FAILED
========================================= */

function fail(){

  running = false;


  const recovered =
    Math.floor(
      score*.05
    );


  data.credits +=
    recovered;


  save();


  $("resultTitle")
    .textContent =
      "MISSION FAILED";


  $("resultInfo")
    .innerHTML =

    `Your operator was eliminated.
    <br><br>
    Kills:
    <b>${kills}</b>
    <br>
    Score:
    <b>${score}</b>
    <br>
    Recovered:
    <b>◆ ${recovered}</b>`;


  $("game")
    .classList
    .add("hidden");


  $("result")
    .classList
    .remove("hidden");

}


/* =========================================
   MOBILE JOYSTICKS
========================================= */

function stick(
  id,
  type
){

  const s =
    $(id);

  const k =
    s.querySelector(
      ".knob"
    );

  let active = false;


  const point =
    e =>
      e.touches
      ? e.touches[0]
      : e;


  const move =
    e => {

      if(!active)
        return;


      const r =
        s.getBoundingClientRect();


      const p =
        point(e);


      let dx =
        p.clientX -
        (
          r.left+
          r.width/2
        );


      let dy =
        p.clientY -
        (
          r.top+
          r.height/2
        );


      const max = 45;


      const len =
        Math.hypot(
          dx,
          dy
        );


      if(len > max){

        dx =
          dx/len*max;

        dy =
          dy/len*max;

      }


      k.style.transform =
        `translate(${dx}px,${dy}px)`;


      if(type === "move"){

        moveX =
          dx/max;

        moveY =
          dy/max;

      }else{

        aimX =
          dx/max;

        aimY =
          dy/max;


        if(
          Math.hypot(
            aimX,
            aimY
          ) < .2
        ){

          aimX = 1;

          aimY = 0;

        }

      }

    };


  const end = () => {

    active = false;

    k.style.transform =
      "translate(0,0)";


    if(type === "move"){

      moveX = 0;

      moveY = 0;

    }

  };


  s.addEventListener(
    "touchstart",
    e => {

      active = true;

      move(e);

      e.preventDefault();

    },
    {passive:false}
  );


  s.addEventListener(
    "touchmove",
    e => {

      move(e);

      e.preventDefault();

    },
    {passive:false}
  );


  s.addEventListener(
    "touchend",
    end
  );

}


stick(
  "move",
  "move"
);


stick(
  "aim",
  "aim"
);


/* =========================================
   KEYBOARD
========================================= */

addEventListener(
  "keydown",
  e => {

    if(
      e.key === "a" ||
      e.key === "ArrowLeft"
    )
      moveX = -1;


    if(
      e.key === "d" ||
      e.key === "ArrowRight"
    )
      moveX = 1;


    if(
      e.key === "w" ||
      e.key === "ArrowUp"
    )
      moveY = -1;


    if(
      e.key === "s" ||
      e.key === "ArrowDown"
    )
      moveY = 1;


    if(e.key === " ")
      jump();


    if(e.key === "Enter")
      shoot();

  }
);


addEventListener(
  "keyup",
  e => {

    if(
      [
        "a",
        "d",
        "ArrowLeft",
        "ArrowRight"
      ].includes(e.key)
    )
      moveX = 0;


    if(
      [
        "w",
        "s",
        "ArrowUp",
        "ArrowDown"
      ].includes(e.key)
    )
      moveY = 0;

  }
);


/* =========================================
   ARMORY PREVIEW
========================================= */

let pScene;

let pCamera;

let pRenderer;

let pGroup;


function drawPreview(){

  const c =
    $("previewCanvas");


  if(!pRenderer){

    pScene =
      new THREE.Scene();


    pScene.background =
      new THREE.Color(
        0x253126
      );


    pCamera =
      new THREE.PerspectiveCamera(
        35,
        1,
        .1,
        50
      );


    pCamera.position.set(
      4,
      4,
      8
    );


    pCamera.lookAt(
      0,
      3,
      0
    );


    pRenderer =
      new THREE.WebGLRenderer({
        canvas:c,
        antialias:true,
        alpha:true
      });


    pRenderer.setPixelRatio(
      Math.min(
        devicePixelRatio,
        1.5
      )
    );


    pScene.add(
      new THREE.HemisphereLight(
        0xffe0bb,
        0x243022,
        2.5
      )
    );


    const l =
      new THREE.DirectionalLight(
        0xffd19a,
        3
      );


    l.position.set(
      -5,
      8,
      7
    );


    pScene.add(l);

  }


  if(pGroup)
    pScene.remove(
      pGroup
    );


  pGroup =
    new THREE.Group();


  pScene.add(
    pGroup
  );


  const skin =
    data.character === "female"
    ? 0x8b5a43
    : data.character === "veteran"
    ? 0x70462f
    : 0x6f4735;


  const uniform =
    data.outfit === "desert"
    ? 0x8c7957
    : data.outfit === "blackops"
    ? 0x1c2420
    : data.outfit === "heavy"
    ? 0x252b28
    : 0x4b5b3d;


  const body =
    box(
      .9,
      2,
      .6,
      uniform
    );

  body.position.y =
    2.6;

  pGroup.add(body);


  const head =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .35,
        14,
        10
      ),
      mat(skin)
    );


  head.position.y =
    4.05;


  pGroup.add(head);


  const helmet =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .4,
        14,
        8,
        0,
        Math.PI*2,
        0,
        Math.PI/2
      ),
      mat(0x20261f)
    );


  helmet.position.y =
    4.2;


  pGroup.add(helmet);


  const leg1 =
    box(
      .38,
      1.8,
      .45,
      uniform
    );


  const leg2 =
    box(
      .38,
      1.8,
      .45,
      uniform
    );


  leg1.position.set(
    -.25,
    .9,
    0
  );


  leg2.position.set(
    .25,
    .9,
    0
  );


  pGroup.add(
    leg1,
    leg2
  );


  const gun =
    box(
      1.8,
      .16,
      .18,
      0x111512
    );


  gun.position.set(
    .8,
    2.75,
    -.35
  );


  pGroup.add(gun);


  pGroup.rotation.y =
    -.35;


  pGroup.position.y =
    .1;


  pRenderer.setSize(
    c.clientWidth,
    c.clientHeight,
    false
  );


  pCamera.aspect =
    c.clientWidth /
    c.clientHeight;


  pCamera.updateProjectionMatrix();


  pRenderer.render(
    pScene,
    pCamera
  );

}


/* =========================================

========================================= */

updateWallet();

weaponUI();

drawPreview();
