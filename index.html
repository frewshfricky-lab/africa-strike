<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>African Strike V6</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050706;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
  color:white;
}

.hidden{display:none!important}

/* =========================
   APP
========================= */

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#263326 0,#10160f 35%,#030403 100%);
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:absolute;
  z-index:50;
  left:0;
  right:0;
  top:0;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 16px;
  background:linear-gradient(#101510ee,#050705ee);
  border-bottom:1px solid #625c32;
}

.logo{
  font-size:23px;
  font-weight:1000;
  font-style:italic;
  letter-spacing:-1px;
  line-height:.8;
}

.logo span{
  color:#f5b72d;
  display:block;
}

.stats{
  display:flex;
  gap:10px;
  align-items:center;
}

.stat{
  background:#111711;
  border:1px solid #514d31;
  border-radius:8px;
  padding:6px 11px;
  font-weight:800;
  font-size:13px;
}

.credits{
  color:#ffc62e;
}

/* =========================
   MENU
========================= */

.screen{
  position:absolute;
  inset:62px 0 0;
}

#menu{
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(90deg,#030504cc,#03050455,#030504cc),
    radial-gradient(circle at 65% 55%,#35422d,#080b08 60%);
}

.menuBox{
  width:min(560px,92vw);
  padding:30px;
  text-align:center;
  background:#090d09e8;
  border:1px solid #6b6032;
  box-shadow:0 0 50px #000;
  border-radius:18px;
}

.menuTitle{
  font-size:clamp(40px,8vw,75px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:-3px;
}

.menuTitle span{
  color:#f2b51f;
}

.subtitle{
  color:#b6bdaf;
  margin:10px 0 25px;
}

.bigButton{
  width:100%;
  border:0;
  padding:17px;
  margin:7px 0;
  border-radius:10px;
  background:linear-gradient(#e9b52b,#9d6812);
  color:#080a06;
  font-weight:1000;
  font-size:18px;
  box-shadow:0 5px 0 #55390c;
}

.bigButton.secondary{
  background:#171d17;
  color:white;
  border:1px solid #4b513e;
  box-shadow:none;
}

/* =========================
   ARMORY
========================= */

#armory{
  padding:12px;
  overflow:auto;
  background:
    linear-gradient(#071007d9,#071007d9),
    radial-gradient(circle at 30% 40%,#405238,#050605);
}

.armoryGrid{
  width:min(1250px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:270px 1fr 320px;
  gap:12px;
  min-height:100%;
}

.panel{
  background:#090d09e8;
  border:1px solid #4f5038;
  border-radius:12px;
  padding:12px;
}

.panelTitle{
  font-size:18px;
  font-weight:1000;
  padding:7px 4px 12px;
  border-bottom:1px solid #34382c;
  margin-bottom:10px;
}

.choice{
  width:100%;
  padding:12px;
  margin:5px 0;
  text-align:left;
  border:1px solid #353b31;
  background:#111711;
  border-radius:9px;
}

.choice.active{
  border-color:#e3ae27;
  background:#2a2411;
  box-shadow:inset 4px 0 #e3ae27;
}

.choice strong{
  display:block;
  color:#f3c440;
}

.choice small{
  color:#9ca496;
}

.operatorStage{
  min-height:500px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:
    linear-gradient(#0c140de0,#050705),
    radial-gradient(circle at 50% 40%,#59654a,#10150f 60%);
  border-radius:10px;
}

.operatorGlow{
  position:absolute;
  width:330px;
  height:330px;
  border-radius:50%;
  background:#d69e2a25;
  filter:blur(35px);
}

.operator{
  position:relative;
  width:min(420px,70%);
  max-height:460px;
  object-fit:contain;
  object-position:center bottom;
  filter:
    drop-shadow(0 20px 18px #000)
    contrast(1.05);
}

/*
  IMPORTANT:
  Put the real game operator assets in:
  assets/operator-male.png
  assets/operator-female.png
  assets/operator-veteran.png
*/

.assetMissing{
  width:220px;
  height:420px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#999;
  border:1px dashed #686856;
  padding:20px;
}

.stageName{
  position:absolute;
  left:15px;
  bottom:15px;
  font-size:22px;
  font-weight:1000;
  color:#f2bd35;
}

.weaponCard{
  background:#111611;
  border:1px solid #3d4336;
  padding:12px;
  border-radius:9px;
  margin-bottom:10px;
}

.weaponName{
  font-size:20px;
  font-weight:1000;
}

.weaponStats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:10px;
}

.bar{
  height:7px;
  background:#292d27;
  border-radius:10px;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  background:#e3ae27;
}

.upgrade{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#b17a18;
  font-weight:1000;
}

.upgrade:disabled{
  opacity:.4;
}

.bottomArmory{
  position:sticky;
  bottom:0;
  grid-column:1/-1;
  display:flex;
  gap:10px;
  padding:10px;
  background:#070a07f5;
  border-top:1px solid #575333;
}

.bottomArmory button{
  flex:1;
}

/* =========================
   GAME
========================= */

#game{
  background:#080b07;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.gameHUD{
  position:absolute;
  z-index:20;
  top:8px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.hudBox{
  background:#050805d9;
  border:1px solid #60603d;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
}

.healthOuter{
  width:130px;
  height:9px;
  background:#262923;
  border-radius:10px;
  overflow:hidden;
  margin-top:4px;
}

#healthBar{
  width:100%;
  height:100%;
  background:#52a33d;
}

/* =========================
   TOUCH CONTROLS
========================= */

#controls{
  position:absolute;
  z-index:30;
  inset:0;
  pointer-events:none;
}

.joystick{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  border:2px solid #ffffff35;
  background:#ffffff0c;
  pointer-events:auto;
  touch-action:none;
}

#moveStick{
  left:25px;
  bottom:30px;
}

#aimStick{
  right:25px;
  bottom:30px;
}

.knob{
  position:absolute;
  width:52px;
  height:52px;
  left:32px;
  top:32px;
  border-radius:50%;
  background:#e8b82eaa;
  border:2px solid #ffe27d;
}

.actionButtons{
  position:absolute;
  right:160px;
  bottom:35px;
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.action{
  width:60px;
  height:60px;
  border-radius:50%;
  border:1px solid #ffffff44;
  background:#111710dd;
  font-weight:1000;
}

.action.fire{
  width:76px;
  height:76px;
  background:#9d291dcc;
  border-color:#ff8060;
}

#pauseBtn{
  position:absolute;
  right:12px;
  top:70px;
  z-index:35;
  padding:9px 12px;
  border:1px solid #777657;
  background:#0b100bd9;
  border-radius:7px;
}

/* =========================
   RESULT
========================= */

#result{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#050705ed;
  z-index:100;
}

.resultBox{
  width:min(500px,90vw);
  text-align:center;
  padding:30px;
  background:#0c110ceF;
  border:1px solid #655b32;
  border-radius:16px;
}

.resultTitle{
  font-size:38px;
  font-weight:1000;
  color:#e9b42b;
}

.resultInfo{
  color:#b7bdb1;
  line-height:1.7;
  margin:15px 0;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){
  .armoryGrid{
    grid-template-columns:190px 1fr;
  }

  .rightPanel{
    grid-column:1/-1;
  }

  .operatorStage{
    min-height:430px;
  }
}

@media(max-width:620px){
  .armoryGrid{
    grid-template-columns:1fr;
  }

  .operatorStage{
    min-height:380px;
  }

  .bottomArmory{
    flex-direction:column;
  }

  .stats .stat:nth-child(1){
    display:none;
  }

  .actionButtons{
    right:145px;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">
  <div class="logo">
    AFRICAN <span>STRIKE</span>
  </div>

  <div class="stats">
    <div class="stat">LEVEL <span id="levelText">1</span></div>
    <div class="stat">MISSIONS <span id="missionText">0</span></div>
    <div class="stat credits">◆ <span id="creditsText">2500</span></div>
  </div>
</div>


<!-- =========================
     MAIN MENU
========================= -->

<section id="menu" class="screen">

  <div class="menuBox">

    <div class="menuTitle">
      AFRICAN <span>STRIKE</span>
    </div>

    <div class="subtitle">
      2.5D TACTICAL COMBAT
    </div>

    <button class="bigButton" onclick="openArmory()">
      ARMORY
    </button>

    <button class="bigButton secondary" onclick="startMission()">
      QUICK START
    </button>

    <button class="bigButton secondary" onclick="resetGame()">
      RESET SAVE
    </button>

  </div>

</section>


<!-- =========================
     ARMORY
========================= -->

<section id="armory" class="screen hidden">

  <div class="armoryGrid">

    <!-- OPERATOR -->
    <div class="panel">

      <div class="panelTitle">
        OPERATOR
      </div>

      <button class="choice active" id="charMale"
              onclick="selectCharacter('male')">
        <strong>MALE OPERATOR</strong>
        <small>Special Forces</small>
      </button>

      <button class="choice" id="charFemale"
              onclick="selectCharacter('female')">
        <strong>FEMALE OPERATOR</strong>
        <small>Recon Specialist</small>
      </button>

      <button class="choice" id="charVeteran"
              onclick="selectCharacter('veteran')">
        <strong>VETERAN</strong>
        <small>Experienced Combatant</small>
      </button>

      <div class="panelTitle">
        OUTFIT
      </div>

      <button class="choice active" onclick="selectOutfit('jungle',this)">
        <strong>JUNGLE CAMO</strong>
        <small>Balanced protection</small>
      </button>

      <button class="choice" onclick="selectOutfit('desert',this)">
        <strong>DESERT CAMO</strong>
        <small>Heat resistance</small>
      </button>

      <button class="choice" onclick="selectOutfit('blackops',this)">
        <strong>BLACK OPS</strong>
        <small>+5% movement</small>
      </button>

      <button class="choice" onclick="selectOutfit('heavy',this)">
        <strong>HEAVY ARMOR</strong>
        <small>+25 armor / slower</small>
      </button>

    </div>


    <!-- CHARACTER -->
    <div class="panel">

      <div class="panelTitle">
        OPERATOR PREVIEW
      </div>

      <div class="operatorStage">

        <div class="operatorGlow"></div>

        <img
          id="operatorImage"
          class="operator"
          src="assets/operator-male.png"
          onerror="showMissingAsset(this)"
          alt="Operator">

        <div class="stageName" id="stageName">
          MALE SPECIAL FORCES
        </div>

      </div>

      <div class="panelTitle">
        BOOTS
      </div>

      <button class="choice active"
              onclick="selectBoots('combat',this)">
        <strong>COMBAT BOOTS</strong>
        <small>Standard movement</small>
      </button>

      <button class="choice"
              onclick="selectBoots('speed',this)">
        <strong>ASSAULT BOOTS</strong>
        <small>+10% movement</small>
      </button>

      <button class="choice"
              onclick="selectBoots('armor',this)">
        <strong>ARMORED BOOTS</strong>
        <small>+10 armor</small>
      </button>

    </div>


    <!-- WEAPON -->
    <div class="panel rightPanel">

      <div class="panelTitle">
        WEAPON LOCKER
      </div>

      <button class="choice active"
              onclick="selectWeapon('rifle',this)">
        <strong>ASSAULT RIFLE</strong>
        <small>Balanced automatic weapon</small>
      </button>

      <button class="choice"
              onclick="selectWeapon('shotgun',this)">
        <strong>TACTICAL SHOTGUN</strong>
        <small>High close-range damage</small>
      </button>

      <button class="choice"
              onclick="selectWeapon('smg',this)">
        <strong>COMBAT SMG</strong>
        <small>Very fast fire rate</small>
      </button>

      <button class="choice"
              onclick="selectWeapon('sniper',this)">
        <strong>PRECISION RIFLE</strong>
        <small>Extreme damage</small>
      </button>

      <button class="choice"
              onclick="selectWeapon('rocket',this)">
        <strong>ROCKET LAUNCHER</strong>
        <small>Explosive damage</small>
      </button>

      <div class="weaponCard">

        <div class="weaponName" id="weaponName">
          ASSAULT RIFLE
        </div>

        <div class="weaponStats">

          <div>
            DAMAGE
            <div class="bar">
              <i id="damageBar" style="width:55%"></i>
            </div>
          </div>

          <div>
            FIRE RATE
            <div class="bar">
              <i id="fireBar" style="width:60%"></i>
            </div>
          </div>

          <div>
            ACCURACY
            <div class="bar">
              <i id="accuracyBar" style="width:65%"></i>
            </div>
          </div>

          <div>
            MAGAZINE
            <div class="bar">
              <i id="magBar" style="width:50%"></i>
            </div>
          </div>

        </div>

        <button class="upgrade"
                id="upgradeButton"
                onclick="upgradeWeapon()">
          UPGRADE — ◆ 1000
        </button>

      </div>

    </div>


    <!-- BOTTOM -->
    <div class="bottomArmory">

      <button class="bigButton secondary"
              onclick="showMenu()">
        BACK
      </button>

      <button class="bigButton"
              onclick="startMission()">
        START MISSION
      </button>

    </div>

  </div>

</section>


<!-- =========================
     GAME
========================= -->

<section id="game" class="screen hidden">

  <canvas id="gameCanvas"></canvas>

  <div class="gameHUD">

    <div class="hudBox">
      HP
      <div class="healthOuter">
        <div id="healthBar"></div>
      </div>
    </div>

    <div class="hudBox">
      WEAPON:
      <span id="gameWeapon">RIFLE</span>
      <br>
      SCORE:
      <span id="scoreText">0</span>
    </div>

    <div class="hudBox">
      MISSION
      <br>
      <span id="missionNumber">1</span>
    </div>

  </div>

  <button id="pauseBtn" onclick="pauseGame()">
    II
  </button>

  <div id="controls">

    <div class="joystick" id="moveStick">
      <div class="knob"></div>
    </div>

    <div class="joystick" id="aimStick">
      <div class="knob"></div>
    </div>

    <div class="actionButtons">

      <button class="action"
              onclick="jump()">
        JUMP
      </button>

      <button class="action"
              onclick="reload()">
        R
      </button>

      <button class="action fire"
              onclick="shoot()">
        FIRE
      </button>

    </div>

  </div>

</section>


<!-- =========================
     RESULT
========================= -->

<section id="result" class="screen hidden">

  <div class="resultBox">

    <div class="resultTitle" id="resultTitle">
      MISSION FAILED
    </div>

    <div class="resultInfo" id="resultInfo">
      You were eliminated.
    </div>

    <button class="bigButton"
            onclick="openArmory()">
      RETURN TO ARMORY
    </button>

    <button class="bigButton secondary"
            onclick="startMission()">
      RETRY MISSION
    </button>

  </div>

</section>

</div>


<script>

/* ==========================================================
   AFRICAN STRIKE V6
   ========================================================== */

const SAVE_KEY = "AFRICAN_STRIKE_V6_SAVE";


/* =========================
   SAVE DATA
========================= */

let save = JSON.parse(localStorage.getItem(SAVE_KEY)) || {

  level:1,
  missions:0,
  credits:2500,

  character:"male",
  outfit:"jungle",
  boots:"combat",

  weapon:"rifle",

  weapons:{
    rifle:{
      damage:55,
      fire:60,
      accuracy:65,
      magazine:50,
      level:1
    },

    shotgun:{
      damage:75,
      fire:35,
      accuracy:45,
      magazine:25,
      level:1
    },

    smg:{
      damage:42,
      fire:90,
      accuracy:55,
      magazine:80,
      level:1
    },

    sniper:{
      damage:95,
      fire:20,
      accuracy:95,
      magazine:20,
      level:1
    },

    rocket:{
      damage:100,
      fire:15,
      accuracy:70,
      magazine:10,
      level:1
    }
  }

};

saveGame();


/* =========================
   SCREEN SYSTEM
========================= */

const menu = document.getElementById("menu");
const armory = document.getElementById("armory");
const game = document.getElementById("game");
const result = document.getElementById("result");

function hideScreens(){

  menu.classList.add("hidden");
  armory.classList.add("hidden");
  game.classList.add("hidden");
  result.classList.add("hidden");

}

function showMenu(){

  stopGame();

  hideScreens();

  menu.classList.remove("hidden");

}

function openArmory(){

  stopGame();

  hideScreens();

  armory.classList.remove("hidden");

  updateArmory();

}


/* =========================
   SAVE
========================= */

function saveGame(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(save)
  );

  updateTopBar();

}

function updateTopBar(){

  document.getElementById("levelText").textContent =
    save.level;

  document.getElementById("missionText").textContent =
    save.missions;

  document.getElementById("creditsText").textContent =
    save.credits.toLocaleString();

}

function resetGame(){

  if(!confirm("Reset all African Strike progress?")) return;

  localStorage.removeItem(SAVE_KEY);

  location.reload();

}


/* =========================
   CHARACTER
========================= */

const characterNames = {

  male:"MALE SPECIAL FORCES",

  female:"FEMALE SPECIAL FORCES",

  veteran:"VETERAN SPECIAL FORCES"

};

function selectCharacter(type){

  save.character = type;

  const image = document.getElementById("operatorImage");

  image.onerror = function(){
    showMissingAsset(this);
  };

  image.src =
    "assets/operator-" + type + ".png";

  image.classList.remove("assetMissing");

  document.getElementById("stageName").textContent =
    characterNames[type];

  document.querySelectorAll("#armory .choice")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(
    "char" +
    type.charAt(0).toUpperCase() +
    type.slice(1)
  ).classList.add("active");

  saveGame();

}

function showMissingAsset(img){

  img.style.display="none";

  const box=document.createElement("div");

  box.className="assetMissing";

  box.innerHTML =
    "OPERATOR ASSET<br><br>" +
    "Upload:<br>" +
    "assets/operator-" +
    save.character +
    ".png";

  img.parentElement.appendChild(box);

}


/* =========================
   OUTFITS
========================= */

function selectOutfit(type,button){

  save.outfit=type;

  document.querySelectorAll(
    "#armory .choice"
  ).forEach(x=>{
    if(
      x.parentElement === button.parentElement
    ){
      x.classList.remove("active");
    }
  });

  button.classList.add("active");

  saveGame();

}


/* =========================
   BOOTS
========================= */

function selectBoots(type,button){

  save.boots=type;

  const parent=button.parentElement;

  parent.querySelectorAll(".choice")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  saveGame();

}


/* =========================
   WEAPONS
========================= */

const weaponNames = {

  rifle:"ASSAULT RIFLE",
  shotgun:"TACTICAL SHOTGUN",
  smg:"COMBAT SMG",
  sniper:"PRECISION RIFLE",
  rocket:"ROCKET LAUNCHER"

};

function selectWeapon(type,button){

  save.weapon=type;

  const parent=button.parentElement;

  parent.querySelectorAll(".choice")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

  updateWeaponUI();

  saveGame();

}

function updateWeaponUI(){

  const w=save.weapons[save.weapon];

  document.getElementById("weaponName")
    .textContent=weaponNames[save.weapon];

  document.getElementById("damageBar")
    .style.width=w.damage+"%";

  document.getElementById("fireBar")
    .style.width=w.fire+"%";

  document.getElementById("accuracyBar")
    .style.width=w.accuracy+"%";

  document.getElementById("magBar")
    .style.width=w.magazine+"%";

  const cost =
    1000 * w.level;

  const button=
    document.getElementById("upgradeButton");

  button.textContent =
    "UPGRADE — ◆ " +
    cost.toLocaleString();

  button.disabled =
    save.credits < cost ||
    w.level >= 10;

  if(w.level >= 10){
    button.textContent="MAX LEVEL";
  }

}

function upgradeWeapon(){

  const w=save.weapons[save.weapon];

  if(w.level>=10) return;

  const cost=1000*w.level;

  if(save.credits<cost){

    alert("Not enough credits.");

    return;

  }

  save.credits-=cost;

  w.level++;

  w.damage=Math.min(100,w.damage+5);
  w.fire=Math.min(100,w.fire+4);
  w.accuracy=Math.min(100,w.accuracy+3);
  w.magazine=Math.min(100,w.magazine+4);

  updateWeaponUI();

  saveGame();

}

/* =========================
   JOYSTICKS
========================= */

function setupJoystick(id,type){

  const stick=document.getElementById(id);
  const knob=stick.querySelector(".knob");

  let active=false;

  function move(e){

    if(!active)return;

    const r=stick.getBoundingClientRect();

    const point=
      e.touches
      ? e.touches[0]
      : e;

    let dx=
      point.clientX-
      (r.left+r.width/2);

    let dy=
      point.clientY-
      (r.top+r.height/2);

    const max=42;

    const length=Math.hypot(dx,dy);

    if(length>max){

      dx=dx/length*max;
      dy=dy/length*max;

    }

    knob.style.transform=
      `translate(${dx}px,${dy}px)`;

    if(type==="move"){

      player.vx=dx/max;

    }

    if(type==="aim"){

      player.aimX=dx/max;
      player.aimY=dy/max;

    }

  }

  function end(){

    active=false;

    knob.style.transform=
      "translate(0,0)";

    if(type==="move"){
      player.vx=0;
    }

  }

  stick.addEventListener(
    "touchstart",
    e=>{
      active=true;
      move(e);
      e.preventDefault();
    },
    {passive:false}
  );

  stick.addEventListener(
    "touchmove",
    e=>{
      move(e);
      e.preventDefault();
    },
    {passive:false}
  );

  stick.addEventListener(
    "touchend",
    end
  );

}

setupJoystick("moveStick","move");
setupJoystick("aimStick","aim");


/* =========================
   JUMP
========================= */

function jump(){

  if(!running || paused)return;

  if(player.grounded){

    player.vy=-13;
    player.grounded=false;

  }

}


/* =========================
   SHOOT
========================= */

function shoot(){

  if(!running || paused)return;

  if(player.cooldown>0)return;

  const w=save.weapons[save.weapon];

  player.cooldown=
    Math.max(
      5,
      30-(w.fire*.22)
    );

  const angle=
    Math.atan2(
      player.aimY,
      player.aimX
    );

  if(save.weapon==="shotgun"){

    for(let i=-2;i<=2;i++){

      const a=angle+i*.12;

      createBullet(a,w.damage*.55);

    }

  }else{

    createBullet(angle,w.damage);

  }

}

function createBullet(angle,damage){

  const speed=
    save.weapon==="sniper"
    ? 18
    : save.weapon==="rocket"
    ? 10
    : 14;

  bullets.push({

    x:player.x+50,
    y:player.y-75,

    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,

    damage:damage,

    rocket:save.weapon==="rocket"

  });

  createMuzzle();

}

function createMuzzle(){

  for(let i=0;i<5;i++){

    particles.push({

      x:player.x+55,
      y:player.y-78,

      vx:Math.random()*5+2,
      vy:(Math.random()-.5)*4,

      life:12,

      size:Math.random()*5+3

    });

  }

}


/* =========================
   RELOAD
========================= */

function reload(){

  player.cooldown=0;

}


/* =========================
   SPAWN ENEMY
========================= */

function spawnEnemy(){

  const types=[
    "soldier",
    "heavy",
    "drone"
  ];

  const type=
    types[
      Math.floor(
        Math.random()*types.length
      )
    ];

  enemies.push({

    type,

    x:
      worldX+
      W+
      100+
      Math.random()*500,

    y:
      type==="drone"
      ? 180+Math.random()*150
      : 0,

    health:
      type==="heavy"
      ? 130
      : type==="drone"
      ? 70
      : 70,

    maxHealth:
      type==="heavy"
      ? 130
      : type==="drone"
      ? 70
      : 70,

    speed:
      type==="heavy"
      ? 1.1
      : type==="drone"
      ? 1.5
      : 1.7,

    cooldown:
      80+Math.random()*100

  });

}


/* =========================
   ENEMY SHOOTING
========================= */

function enemyShoot(e){

  const dx=
    player.x-e.x;

  const dy=
    (player.y-70)-e.y;

  const length=
    Math.hypot(dx,dy)||1;

  enemyBullets.push({

    x:e.x,
    y:e.y-50,

    vx:dx/length*6,
    vy:dy/length*6,

    damage:
      e.type==="heavy"
      ? 14
      : 9

  });

}


/* =========================
   EXPLOSION
========================= */

function explosion(x,y){

  for(let i=0;i<22;i++){

    particles.push({

      x,
      y,

      vx:(Math.random()-.5)*10,
      vy:(Math.random()-.5)*10,

      life:30+Math.random()*20,

      size:3+Math.random()*8

    });

  }

}


/* =========================
   UPDATE
========================= */

function update(){

  if(paused)return;

  /* PLAYER */

  if(keys["a"] || keys["arrowleft"]){
    player.vx=-1;
  }

  if(keys["d"] || keys["arrowright"]){
    player.vx=1;
  }

  if(
    !keys["a"] &&
    !keys["d"] &&
    !keys["arrowleft"] &&
    !keys["arrowright"]
  ){
    if(Math.abs(player.vx)<.2)
      player.vx=0;
  }

  player.x+=player.vx*player.speed;

  player.vy+=.65;

  player.y+=player.vy;

  if(player.y>=0){

    player.y=0;
    player.vy=0;
    player.grounded=true;

  }

  if(player.cooldown>0)
    player.cooldown--;

  /* AUTO FORWARD */

  worldX+=1.25;

  player.x=
    Math.max(
      80,
      Math.min(
        W*.48,
        player.x
      )
    );

  cameraX=
    worldX-player.x+W*.35;


  /* SPAWN */

  if(
    Math.random()<.018 &&
    worldX<missionLength
  ){

    spawnEnemy();

  }


  /* ENEMIES */

  for(let i=enemies.length-1;i>=0;i--){

    const e=enemies[i];

    if(e.type==="drone"){

      e.x-=e.speed;

      e.y+=
        Math.sin(
          Date.now()/400+
          i
        )*.8;

    }else{

      e.x-=e.speed;

    }

    e.cooldown--;

    if(
      e.cooldown<=0 &&
      Math.abs(e.x-player.x)<650
    ){

      enemyShoot(e);

      e.cooldown=
        70+
        Math.random()*100;

    }

    if(e.x<cameraX-200){

      enemies.splice(i,1);

    }

  }


  /* PLAYER BULLETS */

  for(let i=bullets.length-1;i>=0;i--){

    const b=bullets[i];

    b.x+=b.vx;
    b.y+=b.vy;

    let removed=false;

    for(let j=enemies.length-1;j>=0;j--){

      const e=enemies[j];

      if(
        Math.abs(b.x-e.x)<55 &&
        Math.abs(b.y-(e.y-60))<75
      ){

        e.health-=b.damage;

        explosion(
          b.x,
          b.y
        );

        if(e.health<=0){

          score+=
            e.type==="heavy"
            ? 300
            : e.type==="drone"
            ? 200
            : 100;

          missionKills++;

          if(Math.random()<.15){

            pickups.push({

              x:e.x,
              y:e.y-40,
              type:"health"

            });

          }

          enemies.splice(j,1);

        }

        bullets.splice(i,1);

        removed=true;

        break;

      }

    }

    if(
      !removed &&
      (
        b.x<cameraX-100 ||
        b.x>cameraX+W+200
      )
    ){

      bullets.splice(i,1);

    }

  }


  /* ENEMY BULLETS */

  for(
    let i=enemyBullets.length-1;
    i>=0;
    i--
  ){

    const b=enemyBullets[i];

    b.x+=b.vx;
    b.y+=b.vy;

    if(
      Math.abs(b.x-player.x)<35 &&
      Math.abs(b.y-(player.y-65))<65
    ){

      player.health-=b.damage;

      enemyBullets.splice(i,1);

      if(player.health<=0){

        failMission();

        return;

      }

      continue;

    }

    if(
      b.x<cameraX-100 ||
      b.x>cameraX+W+200
    ){

      enemyBullets.splice(i,1);

    }

  }


  /* PICKUPS */

  for(
    let i=pickups.length-1;
    i>=0;
    i--
  ){

    const p=pickups[i];

    if(
      Math.abs(
        p.x-player.x
      )<55
    ){

      if(p.type==="health"){

        player.health=
          Math.min(
            player.maxHealth,
            player.health+35
          );

      }

      pickups.splice(i,1);

    }

  }


  /* PARTICLES */

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=.08;

    p.life--;

    if(p.life<=0)
      particles.splice(i,1);

  }


  if(worldX>=missionLength){

    completeMission();

  }

  updateHUD();

}


/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /* SKY */

  const sky=
    ctx.createLinearGradient(
      0,0,0,H
    );

  sky.addColorStop(0,"#132016");
  sky.addColorStop(.55,"#536345");
  sky.addColorStop(1,"#15180f");

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* DISTANT MOUNTAINS */

  ctx.fillStyle="#263626";

  for(let x=-500;x<W+500;x+=380){

    const px=
      x-
      (cameraX*.08%380);

    ctx.beginPath();

    ctx.moveTo(px,H*.57);

    ctx.lineTo(px+190,H*.35);
    ctx.lineTo(px+380,H*.57);

    ctx.fill();

  }


  /* GROUND */

  const groundY=
    H*.72;

  ctx.fillStyle="#26331e";

  ctx.fillRect(
    0,
    groundY,
    W,
    H-groundY
  );

  ctx.fillStyle="#40502c";

  for(
    let x=-(cameraX%90);
    x<W;
    x+=90
  ){

    ctx.fillRect(
      x,
      groundY+5,
      50,
      3
    );

  }


  /* TREES */

  for(
    let x=-(cameraX*.25%220);
    x<W+220;
    x+=220
  ){

    drawTree(
      x,
      groundY
    );

  }


  /* PICKUPS */

  for(const p of pickups){

    const x=p.x-cameraX;

    if(x<-100||x>W+100)continue;

    ctx.fillStyle="#6be85b";

    ctx.beginPath();

    ctx.arc(
      x,
      groundY-35,
      13,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.font="bold 16px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "+",
      x,
      groundY-29
    );

  }


  /* ENEMIES */

  for(const e of enemies){

    const x=e.x-cameraX;

    if(x<-150||x>W+150)continue;

    drawEnemy(
      e,
      x,
      groundY
    );

  }


  /* PLAYER */

  drawPlayer(
    player.x-cameraX,
    groundY+player.y
  );


  /* BULLETS */

  ctx.lineWidth=3;

  for(const b of bullets){

    const x=b.x-cameraX;

    ctx.strokeStyle=
      b.rocket
      ? "#ffad28"
      : "#ffe88a";

    ctx.beginPath();

    ctx.moveTo(
      x,
      b.y
    );

    ctx.lineTo(
      x-b.vx*2,
      b.y-b.vy*2
    );

    ctx.stroke();

  }


  for(const b of enemyBullets){

    const x=b.x-cameraX;

    ctx.strokeStyle="#ff6350";

    ctx.beginPath();

    ctx.moveTo(x,b.y);
    ctx.lineTo(
      x-b.vx*2,
      b.y-b.vy*2
    );

    ctx.stroke();

  }


  /* PARTICLES */

  for(const p of particles){

    const x=p.x-cameraX;

    ctx.fillStyle=
      p.life>18
      ? "#ffbe32"
      : "#d6d6a0";

    ctx.beginPath();

    ctx.arc(
      x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================
   PLAYER DRAW
========================= */

function drawPlayer(x,ground){

  /*
    The game is ready for the real
    operator sprite here.

    Until the asset is uploaded,
    this temporary tactical silhouette
    keeps the gameplay functional.
  */

  ctx.save();

  ctx.translate(
    x,
    ground
  );


  /* legs */

  ctx.fillStyle=
    save.outfit==="desert"
    ? "#8c7952"
    : "#303b2b";

  ctx.fillRect(
    -22,
    -70,
    15,
    70
  );

  ctx.fillRect(
    8,
    -70,
    15,
    70
  );


  /* boots */

  ctx.fillStyle="#151714";

  ctx.fillRect(
    -25,
    -10,
    23,
    11
  );

  ctx.fillRect(
    8,
    -10,
    27,
    11
  );


  /* body */

  ctx.fillStyle="#283226";

  ctx.fillRect(
    -28,
    -125,
    58,
    62
  );


  /* armor */

  ctx.strokeStyle="#5d684c";
  ctx.lineWidth=4;

  ctx.strokeRect(
    -25,
    -121,
    52,
    52
  );


  /* head */

  ctx.fillStyle="#5a3829";

  ctx.beginPath();

  ctx.arc(
    0,
    -143,
    19,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* helmet */

  ctx.fillStyle="#20261e";

  ctx.beginPath();

  ctx.arc(
    0,
    -150,
    21,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  /* rifle */

  ctx.strokeStyle="#101310";

  ctx.lineWidth=8;

  ctx.beginPath();

  ctx.moveTo(
    0,
    -95
  );

  ctx.lineTo(
    68,
    -105
  );

  ctx.stroke();

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    28,
    -101
  );

  ctx.lineTo(
    58,
    -122
  );

  ctx.stroke();


  /* aim direction */

  const aimAngle=
    Math.atan2(
      player.aimY,
      player.aimX
    );

  ctx.strokeStyle="#e8c25c55";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    35,
    -108
  );

  ctx.lineTo(
    35+
    Math.cos(aimAngle)*90,
    -108+
    Math.sin(aimAngle)*90
  );

  ctx.stroke();


  ctx.restore();

}


/* =========================
   ENEMY DRAW
========================= */

function drawEnemy(e,x,ground){

  ctx.save();

  if(e.type==="drone"){

    ctx.translate(
      x,
      e.y
    );

    ctx.fillStyle="#1c2520";

    ctx.fillRect(
      -25,
      -10,
      50,
      20
    );

    ctx.fillStyle="#050605";

    for(let i=-1;i<=1;i+=2){

      ctx.beginPath();

      ctx.arc(
        i*35,
        0,
        14,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

    ctx.fillStyle="#e23e2d";

    ctx.beginPath();

    ctx.arc(
      0,
      10,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

    return;

  }


  ctx.translate(
    x,
    ground
  );


  /* legs */

  ctx.fillStyle=
    e.type==="heavy"
    ? "#151b18"
    : "#303530";

  ctx.fillRect(
    -18,
    -65,
    13,
    65
  );

  ctx.fillRect(
    8,
    -65,
    13,
    65
  );


  /* body */

  ctx.fillStyle=
    e.type==="heavy"
    ? "#171b1c"
    : "#333832";

  ctx.fillRect(
    -28,
    -120,
    58,
    58
  );


  /* head */

  ctx.fillStyle="#51372b";

  ctx.beginPath();

  ctx.arc(
    0,
    -140,
    18,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* helmet */

  ctx.fillStyle=
    e.type==="heavy"
    ? "#111417"
    : "#242b25";

  ctx.beginPath();

  ctx.arc(
    0,
    -147,
    20,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  /* weapon */

  ctx.strokeStyle="#090b0a";

  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    0,
    -95
  );

  ctx.lineTo(
    -55,
    -105
  );

  ctx.stroke();


  /* health bar */

  ctx.fillStyle="#111";

  ctx.fillRect(
    -35,
    -175,
    70,
    6
  );

  ctx.fillStyle=
    e.type==="heavy"
    ? "#e0a528"
    : "#5ec34e";

  ctx.fillRect(
    -35,
    -175,
    70*
    Math.max(
      0,
      e.health/e.maxHealth
    ),
    6
  );

  ctx.restore();

}


/* =========================
   TREE
========================= */

function drawTree(x,y){

  ctx.fillStyle="#27251a";

  ctx.fillRect(
    x-7,
    y-145,
    14,
    145
  );

  ctx.fillStyle="#263a20";

  for(let i=0;i<5;i++){

    ctx.beginPath();

    ctx.arc(
      x+
      Math.sin(i*2)*28,
      y-150-i*16,
      48,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================
   HUD
========================= */

function updateHUD(){

  document.getElementById(
    "healthBar"
  ).style.width=
    Math.max(
      0,
      player.health/player.maxHealth*100
    )+"%";

  document.getElementById(
    "scoreText"
  ).textContent=score;

  document.getElementById(
    "gameWeapon"
  ).textContent=
    weaponNames[save.weapon];

  document.getElementById(
    "missionNumber"
  ).textContent=
    save.missions+1;

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

  if(!running)return;

  update();

  draw();

  requestAnimationFrame(gameLoop);

}


/* =========================
   PAUSE
========================= */

function pauseGame(){

  paused=!paused;

}


/* =========================
   FAIL
========================= */

function failMission(){

  running=false;

  save.credits+=
    Math.floor(score*.05);

  saveGame();

  document.getElementById(
    "resultTitle"
  ).textContent=
    "MISSION FAILED";

  document.getElementById(
    "resultInfo"
  ).innerHTML=
    "Your operator was eliminated.<br><br>" +
    "Kills: "+missionKills+
    "<br>Score: "+score+
    "<br>Credits recovered: "+
    Math.floor(score*.05);

  hideScreens();

  result.classList.remove("hidden");

}


/* =========================
   COMPLETE
========================= */

function completeMission(){

  running=false;

  const reward=
    1000+
    missionKills*100;

  save.credits+=reward;

  save.missions++;

  if(
    save.missions%3===0
  ){

    save.level++;

  }

  saveGame();

  document.getElementById(
    "resultTitle"
  ).textContent=
    "MISSION COMPLETE";

  document.getElementById(
    "resultInfo"
  ).innerHTML=
    "Area secured.<br><br>"+
    "Enemies eliminated: "+
    missionKills+
    "<br>Score: "+
    score+
    "<br>Reward: ◆ "+
    reward.toLocaleString();

  hideScreens();

  result.classList.remove("hidden");

}


/* =========================
   STOP
========================= */

function stopGame(){

  running=false;
  paused=false;

}


/* =========================
   INITIALIZE
========================= */

updateTopBar();

</script>
